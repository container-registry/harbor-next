<ng-template #permissionTable let-readonly="readonly">
    <table class="table table-compact mt-0">
        <thead>
            <tr>
                <th class="left">
                    {{ 'AUDIT_LOG.RESOURCE' | translate }}
                </th>
                <th class="left" *ngFor="let item of candidateActions">
                    {{ convertKey(item) | translate }}
                </th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngFor="let resource of candidateResources">
                <tr>
                    <td class="left td">
                        <button
                            *ngIf="hasSubRows(resource)"
                            type="button"
                            class="sub-row-toggle"
                            [attr.aria-expanded]="isExpanded(resource)"
                            [attr.aria-label]="convertKey(resource) | translate"
                            (click)="toggleExpanded(resource)">
                            <clr-icon
                                [attr.shape]="
                                    isExpanded(resource)
                                        ? 'caret down'
                                        : 'caret right'
                                "
                                size="12"></clr-icon>
                        </button>
                        {{ convertKey(resource) | translate }}
                    </td>
                    <td class="td" *ngFor="let action of candidateActions">
                        <input
                            *ngIf="isCandidate(resource, action)"
                            type="checkbox"
                            clrCheckbox
                            [disabled]="readonly"
                            [ngModel]="getCheckBoxValue(resource, action)"
                            (ngModelChange)="
                                setCheckBoxValue(resource, action, $event)
                            " />
                    </td>
                </tr>
                <ng-container *ngIf="isExpanded(resource)">
                    <tr class="sub-row" *ngFor="let sub of subRowsOf(resource)">
                        <td class="left td sub-row-label">
                            <span class="sub-row-indent" aria-hidden="true"
                                >&#8627;</span
                            >
                            {{ convertKey(sub) | translate }}
                        </td>
                        <td class="td" *ngFor="let action of subRowCells()">
                            <input
                                *ngIf="action === subRowColumn()"
                                type="checkbox"
                                clrCheckbox
                                [disabled]="readonly"
                                [attr.aria-label]="convertKey(sub) | translate"
                                [ngModel]="getCheckBoxValue(resource, sub)"
                                (ngModelChange)="
                                    setCheckBoxValue(resource, sub, $event)
                                " />
                        </td>
                    </tr>
                </ng-container>
            </ng-container>
        </tbody>
    </table>
</ng-template>

<ng-container *ngIf="mode === PermissionSelectPanelModes.MODAL">
    <div (click)="modalOpen = true">
        <ng-content select="[modal]"></ng-content>
    </div>
    <clr-modal
        [clrModalSize]="'lg'"
        [(clrModalOpen)]="modalOpen"
        [clrModalStaticBackdrop]="false">
        <div class="modal-body">
            <ng-container
                *ngTemplateOutlet="
                    permissionTable;
                    context: { readonly: true }
                "></ng-container>
        </div>
    </clr-modal>
</ng-container>

<ng-container *ngIf="mode === PermissionSelectPanelModes.DROPDOWN">
    <clr-dropdown [clrCloseMenuOnItemClick]="false">
        <span #dropdown class="trigger" clrDropdownTrigger>
            <ng-content></ng-content>
        </span>
        <clr-dropdown-menu
            #dropdownMenu
            class="dropdown-menu p-1"
            clrPosition="{{ dropdownPosition }}"
            [style.position]="usedInDatagrid ? 'fixed' : 'absolute'"
            [style.transform]="usedInDatagrid ? getTransform() : 'unset'"
            *clrIfOpen>
            <div>
                <button
                    class="btn btn-link btn-sm select-all-for-dropdown p-0"
                    (click)="selectAllOrUnselectAll()">
                    <span *ngIf="!isAllSelected()">{{
                        'SYSTEM_ROBOT.SELECT_ALL' | translate
                    }}</span>
                    <span *ngIf="isAllSelected()">{{
                        'SYSTEM_ROBOT.UNSELECT_ALL' | translate
                    }}</span>
                </button>
            </div>
            <ng-container
                *ngTemplateOutlet="
                    permissionTable;
                    context: { readonly: false }
                "></ng-container>
        </clr-dropdown-menu>
    </clr-dropdown>
</ng-container>

<ng-container *ngIf="mode === PermissionSelectPanelModes.NORMAL">
    <div>
        <button
            class="btn btn-outline btn-sm"
            (click)="selectAllOrUnselectAll()">
            <span *ngIf="!isAllSelected()">{{
                'SYSTEM_ROBOT.SELECT_ALL' | translate
            }}</span>
            <span *ngIf="isAllSelected()">{{
                'SYSTEM_ROBOT.UNSELECT_ALL' | translate
            }}</span>
        </button>
    </div>
    <ng-container
        *ngTemplateOutlet="
            permissionTable;
            context: { readonly: false }
        "></ng-container>
</ng-container>
