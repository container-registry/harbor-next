<div>
    <button type="button" class="btn btn-link btn-font" (click)="open()">
        {{ 'PUSH_IMAGE.TITLE' | translate | uppercase }}
    </button>
    <clr-modal [(clrModalOpen)]="opened" clrModalSize="lg">
        <h3 class="modal-title">
            {{
                'PUSH_IMAGE.DIALOG_TITLE' | translate : { project: projectName }
            }}
        </h3>
        <div class="modal-body">
            <inline-alert #copyAlert></inline-alert>
            <div class="clr-row" *ngIf="opened">
                <div class="clr-col-4">
                    <clr-vertical-nav>
                        <ng-container *ngFor="let group of groups">
                            <!-- A lone group needs no heading. -->
                            <ng-container *ngIf="groups.length === 1">
                                <ng-container
                                    [ngTemplateOutlet]="links"
                                    [ngTemplateOutletContext]="{
                                        $implicit: group.sections
                                    }"></ng-container>
                            </ng-container>
                            <clr-vertical-nav-group
                                *ngIf="groups.length > 1"
                                [clrVerticalNavGroupExpanded]="true">
                                {{ group.titleKey | translate }}
                                <span
                                    *ngIf="group.badgeKey"
                                    class="label label-blue"
                                    >{{ group.badgeKey | translate }}</span
                                >
                                <clr-vertical-nav-group-children>
                                    <ng-container
                                        [ngTemplateOutlet]="links"
                                        [ngTemplateOutletContext]="{
                                            $implicit: group.sections
                                        }"></ng-container>
                                </clr-vertical-nav-group-children>
                            </clr-vertical-nav-group>
                        </ng-container>
                    </clr-vertical-nav>
                </div>
                <div class="clr-col-8" *ngIf="activeSection as section">
                    <ol class="list">
                        <li *ngFor="let step of section.steps">
                            <hbr-copy-input
                                (onCopyError)="onCpError($event)"
                                inputSize="55"
                                headerTitle="{{ step.labelKey | translate }}"
                                defaultValue="{{
                                    step.command
                                }}"></hbr-copy-input>
                        </li>
                    </ol>
                    <clr-alert
                        *ngIf="section.hintKey"
                        clrAlertType="info"
                        [clrAlertSizeSmall]="true"
                        [clrAlertClosable]="false">
                        <clr-alert-item>
                            <span class="alert-text">{{
                                section.hintKey | translate
                            }}</span>
                        </clr-alert-item>
                    </clr-alert>
                </div>
            </div>
        </div>
    </clr-modal>
</div>
<ng-template #links let-sections>
    <a
        clrVerticalNavLink
        tabindex="0"
        *ngFor="let section of sections"
        [id]="'push-tab-' + section.id"
        [class.active]="section.id === activeId"
        [attr.aria-current]="section.id === activeId ? 'true' : null"
        (click)="activeId = section.id"
        (keydown.enter)="activeId = section.id">
        {{ section.titleKey | translate }}
    </a>
</ng-template>
