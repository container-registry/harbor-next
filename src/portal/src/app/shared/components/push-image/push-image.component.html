<div>
    <button type="button" class="btn btn-link btn-font" (click)="open()">
        {{ 'PUSH_IMAGE.TITLE' | translate | uppercase }}
    </button>
    <clr-modal [(clrModalOpen)]="opened" clrModalSize="lg">
        <h3 class="modal-title">
            {{
                'PUSH_IMAGE.DIALOG_TITLE' | translate : { project: projectName }
            }}
        </h3>
        <div class="modal-body">
            <inline-alert #copyAlert></inline-alert>
            <clr-tabs *ngIf="opened" clrLayout="vertical">
                <clr-tab *ngFor="let section of sections">
                    <button clrTabLink [id]="'push-tab-' + section.id">
                        {{ section.titleKey | translate }}
                        <span
                            *ngIf="section.badgeKey"
                            class="label label-blue"
                            >{{ section.badgeKey | translate }}</span
                        >
                    </button>
                    <clr-tab-content *clrIfActive="section.id === activeId">
                        <ol class="list">
                            <li *ngFor="let step of section.steps">
                                <hbr-copy-input
                                    (onCopyError)="onCpError($event)"
                                    inputSize="55"
                                    headerTitle="{{
                                        step.labelKey | translate
                                    }}"
                                    defaultValue="{{
                                        step.command
                                    }}"></hbr-copy-input>
                            </li>
                        </ol>
                        <clr-alert
                            *ngIf="section.hintKey"
                            clrAlertType="info"
                            [clrAlertSizeSmall]="true"
                            [clrAlertClosable]="false">
                            <clr-alert-item>
                                <span class="alert-text">{{
                                    section.hintKey | translate
                                }}</span>
                            </clr-alert-item>
                        </clr-alert>
                    </clr-tab-content>
                </clr-tab>
            </clr-tabs>
        </div>
    </clr-modal>
</div>
