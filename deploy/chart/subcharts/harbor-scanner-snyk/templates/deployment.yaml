apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor-scanner-snyk.fullname" . | quote }}
  labels:
    {{- include "harbor-scanner-snyk.labels" . | nindent 4 }}
spec:
  # Scan jobs live in the adapter's memory, so it runs as a single replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "harbor-scanner-snyk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- with (omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "harbor-scanner-snyk.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with (.Values.priorityClassName | default (.Values.global).priorityClassName) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scanner
          image: {{ include "harbor-scanner-snyk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: api-server
              containerPort: 8080
              protocol: TCP
          env:
            - name: SCANNER_API_SERVER_ADDR
              value: ":8080"
            - name: SCANNER_SNYK_CACHE_DIR
              value: /home/scanner/cache
            - name: HOME
              value: /home/scanner/cache
            - name: SNYK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "harbor-scanner-snyk.snyk.existingSecret is required: point it at a Secret holding the Snyk API token" .Values.snyk.existingSecret | quote }}
                  key: {{ .Values.snyk.tokenKey | quote }}
            {{- with .Values.snyk.org }}
            - name: SNYK_ORG
              value: {{ . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- range $kind := list "startup" "readiness" "liveness" }}
          {{- with (index (default dict $.Values.probes) $kind) }}
          {{ $kind }}Probe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /home/scanner/cache
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeLimit }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
