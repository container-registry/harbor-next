# Tests assert chart-computed output for known inputs or fail-fast guards.
# Pure Helm pass-through tests were removed — they only proved `--set`
# works, not that the chart does anything with the value. Full-render
# regression coverage lives in snapshots_test.yaml.
suite: registry component tests
templates:
  - templates/registry.deployment.yaml
  - templates/registry.service.yaml
  - templates/registry.configmap.yaml
  - templates/registry.secret.yaml
  - templates/registry.pvc.yaml
  - templates/registryctl.configmap.yaml
  - templates/registryctl.secret.yaml
tests:
  # The controller sidecar is gone: GC deletion is served by the registry
  # container itself, so the pod has exactly one container.
  - it: should render a single registry container and no controller sidecar
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: registry

  # JOBSERVICE_SECRET switches on the registry's GC deletion API and is the
  # Harbor-Secret jobservice authenticates with, so it must come from the
  # same Secret/key jobservice reads its own JOBSERVICE_SECRET from.
  - it: should inject JOBSERVICE_SECRET from the generated jobservice Secret
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JOBSERVICE_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-harbor-jobservice
                key: JOBSERVICE_SECRET

  - it: should inject JOBSERVICE_SECRET from jobservice.existingSecret
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      jobservice.existingSecret: my-js-secret
      jobservice.existingSecretKey: js-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JOBSERVICE_SECRET
            valueFrom:
              secretKeyRef:
                name: my-js-secret
                key: js-key

  # The registry reaches storage directly: proxy env there would push all
  # blob traffic through the proxy and break IMDS instance-role creds
  # (169.254.169.254 is not in noProxy) and in-cluster S3 by short name.
  - it: 8gcr should not set proxy env on registry even with registry in proxy.components
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      proxy.httpProxy: http://proxy.example.com:3128
      proxy.components: [registry]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTP_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
          any: true

  # Pins the hardcoded registry port and its name (consumed by the
  # ingress/HTTPRoute backend.service.port.name references). The registry
  # serves the GC deletion API on this same port, so there is no
  # separate controller port.
  - it: should create registry service with correct ports
    template: templates/registry.service.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - equal:
          path: spec.ports[0].name
          value: http-registry
      - equal:
          path: spec.ports[0].port
          value: 5000
      - notContains:
          path: spec.ports
          content:
            name: http-controller
          any: true
      - lengthEqual:
          path: spec.ports
          count: 2

  # Pins the PVC-gating conditional: a PVC is rendered only when
  # persistence.enabled=true AND no existingClaim is set. The chart no
  # longer inspects storage backend (registry.config is opaque to the
  # PVC template) — users are responsible for aligning persistence with
  # their chosen backend.
  - it: should create PVC when persistence is enabled
    template: templates/registry.pvc.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.persistence.enabled: true
      registry.persistence.size: 100Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 100Gi

  # Pins the gating: persistence.enabled=false suppresses the PVC
  # regardless of which storage backend is in registry.config.
  - it: should not create PVC when persistence is disabled
    template: templates/registry.pvc.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ============================================================================
  # registry.config — YAML passthrough into config.yml
  # ============================================================================

  # The chart default ships NO storage driver — the filesystem default is
  # injected at render time only when the user set none. This is what kills
  # the deep-merge footgun: a user's `s3:` can't collide with a chart-side
  # `filesystem:` because the chart side never has one.
  - it: should inject filesystem driver when no driver is set
    template: templates/registry.configmap.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: "filesystem:"
      - matchRegex:
          path: data["config.yml"]
          pattern: "rootdirectory: /storage"

  # Setting a driver suppresses the filesystem injection — no `null` dance.
  - it: should render S3 as the only driver without nulling filesystem
    template: templates/registry.configmap.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.config.storage.s3:
        region: us-west-2
        bucket: my-harbor-bucket
        forcepathstyle: true
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: "region: us-west-2"
      - matchRegex:
          path: data["config.yml"]
          pattern: "forcepathstyle: true"
      - notMatchRegex:
          path: data["config.yml"]
          pattern: "filesystem:"

  # Two drivers must fail at template time — distribution requires exactly
  # one and would CrashLoop at boot otherwise. Asserted against the
  # deployment template: its checksum include re-renders the configmap, and
  # helm-unittest attributes the failure there in multi-template suites.
  - it: should fail template rendering when two storage drivers are set
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.config.storage.s3.bucket: b
      registry.config.storage.azure.accountname: a
    asserts:
      - failedTemplate:
          errorPattern: "multiple drivers"

  # Meta keys (cache/maintenance/delete/redirect) are not drivers and never
  # count toward the exactly-one rule.
  - it: should not count storage meta keys as drivers
    template: templates/registry.configmap.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.config.storage.s3.bucket: b
      registry.config.storage.redirect.disable: true
      registry.config.storage.delete.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: "bucket: b"

  # ============================================================================
  # registry.existingConfigMap — chart skips ConfigMap generation
  # ============================================================================

  - it: should not render registry ConfigMap when existingConfigMap is set
    template: templates/registry.configmap.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingConfigMap: my-external-cfg
    asserts:
      - hasDocuments:
          count: 0

  - it: should reference existingConfigMap on the registry-config volume
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingConfigMap: my-external-cfg
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: registry-config
            configMap:
              name: my-external-cfg

  # Storage credentials injection is independent of registry.config, so
  # existingConfigMap users still get correct credential wiring.
  - it: should still inject S3 env when existingConfigMap and storageCredentials.s3 are both set
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingConfigMap: my-external-cfg
      registry.storageCredentials.s3.existingSecret: my-s3-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: REGISTRY_STORAGE_S3_ACCESSKEY

  # Pins the gating: setting persistence.existingClaim must suppress the
  # generated PVC (else the chart would create a PVC AND the deployment
  # would reference an unrelated one).
  - it: should not render generated PVC when existingClaim is set
    template: templates/registry.pvc.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.persistence.enabled: true
      registry.persistence.existingClaim: my-existing-pvc
    asserts:
      - hasDocuments:
          count: 0

  # Pins the cross-template wiring: when existingClaim is set, the
  # deployment's storage volume must reference that claim verbatim.
  - it: should wire existingClaim into the deployment volume
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.persistence.enabled: true
      registry.persistence.existingClaim: my-existing-pvc
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage
            persistentVolumeClaim:
              claimName: my-existing-pvc

  # ============================================================================
  # registry.existingSecret wiring
  # Regression guards for facffbd3c (Fix #19) and 4fd719d7a.
  #
  # When `registry.existingSecret` is set, the generated `*-registry`
  # Secret stops emitting REGISTRY_HTTP_SECRET. The registry container
  # must source it from the BYO Secret instead (was missed in facffbd3c →
  # fixed in 4fd719d7a — only had envFrom on the generated Secret).
  # `existingSecretKey` defaults to REGISTRY_HTTP_SECRET so an unset
  # key value can't render `secretKeyRef.key: ""`.
  # ============================================================================

  - it: should skip the generated registry Secret entirely when existingSecret is set
    template: templates/registry.secret.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingSecret: my-reg
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-harbor-registry-htpasswd

  - it: should inject REGISTRY_HTTP_SECRET into the registry container from existingSecret
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingSecret: my-reg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_HTTP_SECRET
            valueFrom:
              secretKeyRef:
                name: my-reg
                key: REGISTRY_HTTP_SECRET

  - it: should honor a custom existingSecretKey
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingSecret: my-reg
      registry.existingSecretKey: customRegKey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_HTTP_SECRET
            valueFrom:
              secretKeyRef:
                name: my-reg
                key: customRegKey

  # ============================================================================
  # registry.storageCredentials.<backend> — BYO Secret patterns.
  # Tracks the External-Secrets-Operator / Vault use case from
  # goharbor/harbor-helm#189. Production users need credentials to come
  # from a managed Secret, not plaintext in values.yaml.
  #
  # In the new chart, env injection is gated solely on
  # `storageCredentials.<backend>.existingSecret` being set — independent
  # of what backend is active in registry.config (distribution ignores
  # env vars that don't match its active driver).
  # ============================================================================

  - it: should inject S3 accesskey/secretkey from storageCredentials
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.storageCredentials.s3.existingSecret: my-s3-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: REGISTRY_STORAGE_S3_ACCESSKEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_S3_SECRETKEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: REGISTRY_STORAGE_S3_SECRETKEY

  - it: should honor custom S3 key names in the BYO Secret
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.storageCredentials.s3.existingSecret: my-s3-creds
      registry.storageCredentials.s3.existingSecretAccessKeyKey: AWS_ACCESS_KEY_ID
      registry.storageCredentials.s3.existingSecretSecretKeyKey: AWS_SECRET_ACCESS_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: AWS_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_S3_SECRETKEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: AWS_SECRET_ACCESS_KEY

  - it: should not inject S3 env when storageCredentials.s3.existingSecret is unset
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_S3_ACCESSKEY
          any: true

  - it: should inject Azure accountkey from storageCredentials
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.storageCredentials.azure.existingSecret: my-azure-creds
      registry.storageCredentials.azure.existingSecretKey: AZURE_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_AZURE_ACCOUNTKEY
            valueFrom:
              secretKeyRef:
                name: my-azure-creds
                key: AZURE_KEY

  - it: should inject OSS accesskeysecret from storageCredentials
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.storageCredentials.oss.existingSecret: my-oss-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRY_STORAGE_OSS_ACCESSKEYSECRET
            valueFrom:
              secretKeyRef:
                name: my-oss-creds
                key: REGISTRY_STORAGE_OSS_ACCESSKEYSECRET

  # ============================================================================
  # Probes — full K8s specs rendered verbatim from values; per-key overrides
  # coalesce with defaults; null omits the probe entirely.
  # ============================================================================

  - it: should render fast-start probes with no initialDelay
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 2
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds

  - it: should coalesce a single probe override with the remaining defaults
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.probes.readiness.periodSeconds: 9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 9
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 2

  - it: should omit a probe set to null
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.probes.startup: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: should mount GCS keyfile Secret when storageCredentials.gcs.existingSecret is set
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.storageCredentials.gcs.existingSecret: my-gcs-key
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gcs-key
            secret:
              secretName: my-gcs-key
              items:
                - key: gcs-key.json
                  path: key.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gcs-key
            mountPath: /etc/registry/gcs
            readOnly: true

  # ============================================================================
  # Pinned-secret wiring (GitOps existingSecret paths)
  # ============================================================================
  # Pins: credentials.existingSecret swaps the htpasswd mount to the BYO
  # Secret (key REGISTRY_HTPASSWD) instead of the generated -htpasswd one.
  - it: should mount htpasswd from credentials.existingSecret when set
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.credentials.existingSecret: reg-creds
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: registry-htpasswd
            secret:
              items:
                - key: REGISTRY_HTPASSWD
                  path: passwd
              secretName: reg-creds

  # Pins: registry.existingSecret skips the generated Secret, so the
  # registry container must drop its secretRef.
  - it: should drop generated Secret envFrom when registry is fully externalized
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      registry.existingSecret: my-reg
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  # ============================================================================
  # image.source=upstream keeps the registryctl sidecar: vanilla goharbor
  # jobservice deletes GC blobs through it, and registry-photon has no
  # deletion API (a 404 there makes vanilla GC drop DB rows but keep blobs).
  # ============================================================================

  - it: upstream should render registry + registryctl containers in order
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      image.source: upstream
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[0].name
          value: registry
      - equal:
          path: spec.template.spec.containers[1].name
          value: registryctl
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 8080
      - exists:
          path: spec.template.metadata.annotations["checksum/registryctl-configmap"]
      - exists:
          path: spec.template.metadata.annotations["checksum/registryctl-secret"]
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: registry-config
            mountPath: /etc/registryctl/config.yml
            subPath: ctl-config.yml

  - it: 8gcr should render no sidecar checksum annotations
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/registryctl-configmap"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/registryctl-secret"]

  # The sidecar holds the GC secrets; the vanilla registry container must
  # not get JOBSERVICE_SECRET (it would not use it).
  - it: upstream should put JOBSERVICE_SECRET and CORE_SECRET on the sidecar only
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      image.source: upstream
      registry.extraEnv:
        - name: SENTINEL_FOR_TEST
          value: "x"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: JOBSERVICE_SECRET
          any: true
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: JOBSERVICE_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-harbor-jobservice
                key: JOBSERVICE_SECRET
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: CORE_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-harbor-core
                key: secret

  - it: upstream sidecar uses registry.controller.resources when set
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      image.source: upstream
      registry.resources:
        requests:
          cpu: 100m
      registry.controller.resources:
        requests:
          cpu: 25m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 25m

  - it: upstream sidecar falls back to registry.resources
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      image.source: upstream
      registry.resources:
        requests:
          cpu: 111m
    asserts:
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 111m

  - it: upstream sidecar gets REGISTRY_HTTP_SECRET and S3 creds from BYO Secrets
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      image.source: upstream
      registry.existingSecret: my-reg
      registry.storageCredentials.s3.existingSecret: my-s3-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REGISTRY_HTTP_SECRET
            valueFrom:
              secretKeyRef:
                name: my-reg
                key: REGISTRY_HTTP_SECRET
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REGISTRY_STORAGE_S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: REGISTRY_STORAGE_S3_ACCESSKEY
      - notContains:
          path: spec.template.spec.containers[1].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-harbor-registry

  - it: upstream sidecar references existingConfigMap in envFrom
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      image.source: upstream
      registry.existingConfigMap: my-external-cfg
    asserts:
      - contains:
          path: spec.template.spec.containers[1].envFrom
          content:
            configMapRef:
              name: my-external-cfg

  - it: upstream applies proxy env to the registryctl sidecar only
    template: templates/registry.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
