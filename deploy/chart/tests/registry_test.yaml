      image.source: upstream
      proxy.httpProxy: http://proxy.example.com:3128
      proxy.components: [registry]
      registry.extraEnv:
        - name: SENTINEL_FOR_TEST
          value: "x"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: HTTP_PROXY
            value: http://proxy.example.com:3128
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: NO_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
