# All tests assert chart-computed output for known inputs. Pure Helm
# pass-through tests (replicas, podAnnotations, nodeSelector, etc.)
# were removed — they only proved `--set` works, not that the chart
# does anything with the value. Full-render regression coverage for
# the exporter component lives in snapshots_test.yaml.
suite: exporter component tests
templates:
  - templates/exporter.deployment.yaml
  - templates/exporter.service.yaml
  - templates/exporter.configmap-env.yaml
  - templates/exporter.secret.yaml
  - templates/serviceaccounts.yaml
tests:
  # Pins: exporter Deployment is gated by .Values.exporter.enabled (default-off, off-by-flag).
  - it: should not render exporter Deployment when disabled
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Pins: exporter Service is gated by the same .Values.exporter.enabled flag.
  - it: should not render exporter Service when disabled
    template: templates/exporter.service.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Pins: chart writes HARBOR_DATABASE_HOST/PORT/USERNAME env entries from
  # the shared .Values.database.* block (not exporter-local config).
  - it: should wire database env from .Values.database
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: mydb.example.com
      harborAdminPassword: Harbor12345
      database.port: 5433
      database.username: harbor_user
      exporter.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_HOST
            value: "mydb.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_PORT
            value: "5433"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_USERNAME
            value: "harbor_user"

  # ============================================================================
  # exporter.config / exporter.secret — forward-compat env passthrough.
  # Exporter is env-driven; a new HARBOR_EXPORTER_* setting works with no
  # chart change via toEnvVars → ConfigMap/Secret → envFrom.
  # ============================================================================

  # A brand-new config key the chart has never heard of round-trips into the
  # exporter env ConfigMap.
  - it: should render arbitrary exporter.config into the env ConfigMap
    template: templates/exporter.configmap-env.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      exporter.config:
        SOME_FUTURE_EXPORTER_FLAG: enabled
        cache_time: 23
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.SOME_FUTURE_EXPORTER_FLAG
          value: "enabled"
      - equal:
          path: data.CACHE_TIME
          value: "23"

  # The Deployment envFrom-references the env ConfigMap when config is set.
  - it: should envFrom the exporter env ConfigMap when config is set
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      exporter.config:
        SOME_FUTURE_EXPORTER_FLAG: enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-harbor-next-exporter-env

  # No empty ConfigMap and no envFrom when config is unset (default).
  - it: should not render exporter env ConfigMap when config is empty
    template: templates/exporter.configmap-env.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # Sensitive values land base64-encoded in a dedicated Secret.
  - it: should b64-encode exporter.secret into the exporter Secret
    template: templates/exporter.secret.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      exporter.secret:
        MY_TOKEN: s3cr3t
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.MY_TOKEN
          value: "czNjcjN0"

  # Regression guard for the Copilot review finding on PR #56: external
  # Redis with a password put $(REDIS_PASSWORD) into HARBOR_REDIS_URL
  # while the env var was only defined for valkey.auth.enabled — the
  # exporter got a literal, unexpanded placeholder in its Redis URL.
  # (REDIS_PASSWORD must also be defined BEFORE the URL in the env list;
  # Kubernetes does not expand forward references.)
  - it: should inject REDIS_PASSWORD env for external Redis with password
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      valkey.enabled: false
      externalRedis.host: redis.ext
      externalRedis.password: secretpw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_REDIS_URL
            value: "redis://:$(REDIS_PASSWORD)@redis.ext:6379/1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-harbor-next-redis
                key: REDIS_PASSWORD

  # Config-reload: exporter.config / exporter.secret feed env via envFrom by
  # name, so editing their values would not otherwise roll the pod. Asserts
  # both checksum annotations are wired on the pod template.
  - it: should annotate the pod template with config/secret checksums
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/configmap-env"]
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]

  # ============================================================================
  # database.minConns + per-component override (issue #564).
  #
  # The exporter is the component that least needs a warm pool, but its
  # explicit env beat the exporter.config envFrom ConfigMap, so it could not
  # be tuned separately from core. Any name claimed in exporter.config /
  # exporter.secret now suppresses the chart's own entry.
  # ============================================================================

  - it: should render an explicit database.minConns of 0
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      database.minConns: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_MIN_CONNS
            value: "0"

  - it: should fall back to 2 when database.minConns is null
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      database.minConns: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_MIN_CONNS
            value: "2"

  # Flat spelling: keys carry the HARBOR_ prefix themselves, because
  # toEnvVars adds none and the exporter's viper reads HARBOR_*.
  - it: should let exporter.config override the chart-managed minConns
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      database.minConns: 2
      exporter.config:
        HARBOR_DATABASE_MIN_CONNS: 0
    asserts:
      # The chart entry is gone entirely — otherwise it would shadow envFrom.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_MIN_CONNS
            value: "2"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_MIN_CONNS
            value: "0"

  # Nested spelling flattens to the same env name, so it must be recognized too.
  - it: should recognize the nested spelling of an exporter.config override
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      exporter.config:
        harbor:
          database:
            min_conns: 0
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_MIN_CONNS
            value: "2"

  # The override applies to every chart-managed name, not just the pool knobs.
  - it: should let exporter.config override chart-managed wiring
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      exporter.config:
        HARBOR_DATABASE_HOST: other-pg.example.com
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_HOST
            value: postgres.example.com

  # exporter.secret is the other half of the passthrough and must suppress too.
  - it: should let exporter.secret override a chart-managed env
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      exporter.secret:
        HARBOR_DATABASE_MIN_CONNS: 0
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HARBOR_DATABASE_MIN_CONNS
            value: "2"

  # Env order is load-bearing: K8s only expands $(REDIS_PASSWORD) from entries
  # earlier in the list. The filter must not reorder what it passes through.
  # Indices are absolute — bump them when chart-managed env entries are added
  # or removed ahead of these two.
  - it: should keep REDIS_PASSWORD ahead of HARBOR_REDIS_URL
    template: templates/exporter.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      exporter.enabled: true
      valkey.enabled: false
      externalRedis.host: redis.ext
      externalRedis.password: secret123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[19].name
          value: REDIS_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].env[20].name
          value: HARBOR_REDIS_URL
