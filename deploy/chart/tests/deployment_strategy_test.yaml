# Tests for the shared `harbor.deploymentStrategy` helper. Every
# deployment renders an explicit strategy with the K8s rollingUpdate
# defaults so helm owns those fields under server-side apply and can drop
# them when the user switches to Recreate.
suite: deployment strategy helper tests
templates:
  - templates/core.deployment.yaml
  - templates/core.configmap.yaml
  - templates/core.secret.yaml
  - templates/portal.deployment.yaml
  - templates/portal.configmap.yaml
  - templates/registry.deployment.yaml
  - templates/registry.configmap.yaml
  - templates/registry.secret.yaml
  - templates/registryctl.configmap.yaml
  - templates/registryctl.secret.yaml
  - templates/jobservice.deployment.yaml
  - templates/jobservice.configmap.yaml
  - templates/jobservice.configmap-env.yaml
  - templates/jobservice.secret.yaml
  - templates/exporter.deployment.yaml
  - templates/exporter.configmap-env.yaml
  - templates/exporter.secret.yaml
tests:
  - it: core should render explicit RollingUpdate defaults when unset
    template: templates/core.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 25%
              maxUnavailable: 25%

  - it: core should keep user rollingUpdate values and default the rest
    template: templates/core.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      core.deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 25%

  - it: core should keep a zero maxUnavailable
    template: templates/core.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      core.deploymentStrategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0

  - it: core should render no rollingUpdate when type is Recreate
    template: templates/core.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      core.deploymentStrategy.type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: core should accept an empty rollingUpdate map with Recreate
    template: templates/core.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      core.deploymentStrategy:
        type: Recreate
        rollingUpdate: {}
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: core should fail when Recreate is combined with rollingUpdate
    template: templates/core.deployment.yaml
    set:
      externalURL: https://harbor.example.com
      database.host: postgres.example.com
      harborAdminPassword: Harbor12345
      core.deploymentStrategy:
        type: Recreate
        rollingUpdate:
          maxSurge: 1
    asserts:
      - failedTemplate:
          errorPattern: "rollingUpdate may not be set when type is Recreate"

