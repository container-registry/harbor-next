suite: removed network values
templates:
  - templates/validate-values.yaml
set:
  externalURL: https://harbor.example.com
  database.host: postgres.example.com
  harborAdminPassword: Harbor12345
tests:
  # Pins: the removed value fails the render instead of being dropped, which would widen
  # false (public_only) to the block_restricted default.
  - it: should fail when the removed allowPrivateNetworkAccess is false
    set:
      network.allowPrivateNetworkAccess: false
    asserts:
      - failedTemplate:
          errorMessage: "network.allowPrivateNetworkAccess (false) was removed: set network.webhookEgress.policy instead (true: allow_all, false: public_only, unset: block_restricted) and remove network.allowPrivateNetworkAccess."

  # Pins: true does not silently keep allow_all either; it must be spelled out as the policy.
  - it: should fail when the removed allowPrivateNetworkAccess is true
    set:
      network.allowPrivateNetworkAccess: true
    asserts:
      - failedTemplate:
          errorMessage: "network.allowPrivateNetworkAccess (true) was removed: set network.webhookEgress.policy instead (true: allow_all, false: public_only, unset: block_restricted) and remove network.allowPrivateNetworkAccess."

  # Pins: a policy does not excuse the leftover value.
  - it: should fail when the removed allowPrivateNetworkAccess is set next to a policy
    set:
      network.allowPrivateNetworkAccess: false
      network.webhookEgress.policy: public_only
    asserts:
      - failedTemplate:
          errorMessage: "network.allowPrivateNetworkAccess (false) was removed: set network.webhookEgress.policy instead (true: allow_all, false: public_only, unset: block_restricted) and remove network.allowPrivateNetworkAccess."

  # Pins: the empty default of earlier values files has no effect, so it still renders.
  - it: should render with an empty allowPrivateNetworkAccess
    set:
      network.allowPrivateNetworkAccess: ""
    asserts:
      - notFailedTemplate: {}

  - it: should render with only a policy
    set:
      network.webhookEgress.policy: allow_all
    asserts:
      - notFailedTemplate: {}
