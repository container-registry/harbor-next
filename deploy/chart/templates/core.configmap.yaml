{{- $coreConfigEnv := "" }}
{{- if .Values.core.config }}
{{- $coreConfigEnv = include "harbor.toEnvVars" (dict "values" .Values.core.config "prefix" "" "isSecret" false) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harbor.fullname" . }}-core
  labels:
    {{- include "harbor.componentLabels" (dict "root" . "component" "core") | nindent 4 }}
  {{- with (include "harbor.annotations" (dict "root" . "local" nil)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  app.conf: |+
    appname = Harbor
    runmode = prod
    enablegzip = true

    [prod]
    httpport = {{ include "harbor.core.port" . }}
  PORT: {{ include "harbor.core.port" . | quote }}
  DATABASE_TYPE: "postgresql"
  # Harbor Core configuration
  EXT_ENDPOINT: {{ include "harbor.externalURL" . | quote }}
  CORE_URL: {{ include "harbor.core.url" . | quote }}
  PORTAL_URL: {{ include "harbor.portal.url" . | quote }}
  REGISTRY_URL: {{ include "harbor.registry.url" . | quote }}
  JOBSERVICE_URL: {{ include "harbor.jobservice.url" . | quote }}
  TOKEN_SERVICE_URL: {{ include "harbor.token.service.url" . }}
  CORE_LOCAL_URL: "http://127.0.0.1:{{ include "harbor.core.port" . }}"
  WITH_TRIVY: {{ include "harbor.trivy.enabled" . | quote }}
  TRIVY_ADAPTER_URL: {{ include "harbor.trivy.url" . | quote }}
  REGISTRY_STORAGE_PROVIDER_NAME: {{ include "harbor.registry.storageType" . | quote }}
  CONFIG_PATH: "/etc/core/app.conf"
  REGISTRY_CONTROLLER_URL: {{ include "harbor.registryctl.url" . }}
  REGISTRY_CREDENTIAL_USERNAME: "{{ .Values.registry.credentials.username }}"
  {{- if has "core" .Values.proxy.components }}
  HTTP_PROXY: "{{ .Values.proxy.httpProxy }}"
  HTTPS_PROXY: "{{ .Values.proxy.httpsProxy }}"
  NO_PROXY: {{ include "harbor.noProxy" . }}
  {{- end }}
  HARBOR_ALLOW_PRIVATE_NETWORK_ACCESS: {{ .Values.network.allowPrivateNetworkAccess | quote }}
  PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE: "docker-hub,harbor,azure-acr,ali-acr,aws-ecr,google-gcr,docker-registry,github-ghcr,jfrog-artifactory"
  REPLICATION_ADAPTER_WHITELIST: "ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr,sftp,harbor-satellite"
  {{- if .Values.metrics.enabled}}
  METRIC_ENABLE: "true"
  METRIC_PATH: {{ include "harbor.metrics.path" . | quote }}
  METRIC_PORT: {{ include "harbor.metrics.port" . | quote }}
  METRIC_NAMESPACE: harbor
  METRIC_SUBSYSTEM: core
  {{- end }}

  # Database configuration
  POSTGRESQL_HOST: {{ include "harbor.database.host" . | quote }}
  POSTGRESQL_PORT: {{ include "harbor.database.port" . | quote }}
  POSTGRESQL_DATABASE: {{ include "harbor.database.database" . | quote }}
  POSTGRESQL_USERNAME: {{ include "harbor.database.username" . | quote }}
  POSTGRESQL_SSLMODE: {{ include "harbor.database.sslmode" . | quote }}
  POSTGRESQL_MAX_OPEN_CONNS: {{ .Values.database.maxOpenConns | default 100 | quote }}
  POSTGRESQL_MIN_CONNS: {{ include "harbor.database.minConns" . | quote }}
  POSTGRESQL_CONN_MAX_IDLE_TIME: {{ .Values.database.connMaxIdleTime | quote }}
  POSTGRESQL_CONN_MAX_LIFETIME: {{ .Values.database.connMaxLifetime | quote }}
  POSTGRESQL_STATEMENT_TIMEOUT: {{ .Values.database.statementTimeout | quote }}
  # Redis configuration. The _REDIS_URL_* values live as explicit env on
  # the Deployment, NOT here: they embed $(REDIS_PASSWORD) when Redis
  # auth is on, and Kubernetes never expands $(VAR) in envFrom values.
  CHART_CACHE_DRIVER: "redis"
  # Logging
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}

  # Cache configuration
  CACHE_ENABLED: {{ .Values.cache.enabled | quote }}
  {{- if .Values.cache.enabled }}
  CACHE_EXPIRE_HOURS: {{ .Values.cache.expireHours | quote }}
  {{- end }}

  # Core-specific settings
  {{- if .Values.core.configureUserSettings }}
  CONFIG_OVERWRITE_JSON: {{ .Values.core.configureUserSettings | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.core.defaultProjectName) }}
  {{- $inExtraEnv := false }}
  {{- range .Values.core.extraEnv }}{{ if eq .name "DEFAULT_PROJECT_NAME" }}{{ $inExtraEnv = true }}{{ end }}{{ end }}
  {{- $coreSecretEnv := "" }}
  {{- if .Values.core.secret }}
  {{- $coreSecretEnv = include "harbor.toEnvVars" (dict "values" .Values.core.secret "prefix" "" "isSecret" false) }}
  {{- end }}
  {{- if or $inExtraEnv (regexMatch "(?m)^DEFAULT_PROJECT_NAME:" (print $coreConfigEnv "\n" $coreSecretEnv)) }}
  {{- fail "set core.defaultProjectName or DEFAULT_PROJECT_NAME in core.config/core.secret/core.extraEnv, not both" }}
  {{- end }}
  DEFAULT_PROJECT_NAME: {{ .Values.core.defaultProjectName | quote }}
  {{- end }}
  {{- if .Values.core.quotaUpdateProvider }}
  QUOTA_UPDATE_PROVIDER: {{ .Values.core.quotaUpdateProvider | quote }}
  {{- end }}
  {{- if .Values.core.artifactPullAsyncFlushDuration }}
  ARTIFACT_PULL_ASYNC_FLUSH_DURATION: {{ .Values.core.artifactPullAsyncFlushDuration | quote }}
  {{- end }}
  {{- if .Values.core.gdpr }}
  GDPR_DELETE_USER: {{ .Values.core.gdpr.deleteUser | quote }}
  GDPR_AUDIT_LOGS: {{ .Values.core.gdpr.auditLogsCompliant | quote }}
  {{- end }}

  # Config via toEnvVars
  {{- if $coreConfigEnv }}
  {{- $coreConfigEnv | nindent 2 }}
  {{- end }}
