{{- /* Chart defaults for jobservice env, indented as the trace helpers emit
      them. Keys set in global.env or jobservice.env override them. */}}
{{- define "harbor.jobservice.chartEnv" }}
  # Jobservice configuration
  CORE_URL: {{ include "harbor.core.url" . | quote }}
  TOKEN_SERVICE_URL: {{ include "harbor.token.service.url" . | quote }}
  REGISTRY_CREDENTIAL_USERNAME: "{{ .Values.registry.credentials.username }}"
  REGISTRY_URL: {{ include "harbor.registry.url" . | quote }}
  REGISTRY_CONTROLLER_URL: {{ include "harbor.registryctl.url" . | quote }}

  # Redis configuration. The _REDIS_URL_* values live as explicit env on
  # the Deployment, NOT here: they embed $(REDIS_PASSWORD) when Redis
  # auth is on, and Kubernetes never expands $(VAR) in envFrom values.
  CACHE_ENABLED: {{ .Values.cache.enabled | quote }}
  {{- if .Values.cache.enabled }}
  CACHE_EXPIRE_HOURS: {{ .Values.cache.expireHours | quote }}
  {{- end }}

  # Logging
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}

  {{- if has "jobservice" .Values.proxy.components }}
  HTTP_PROXY: "{{ .Values.proxy.httpProxy }}"
  HTTPS_PROXY: "{{ .Values.proxy.httpsProxy }}"
  NO_PROXY: "{{ template "harbor.noProxy" . }}"
  {{- end }}
  {{- include "harbor.webhookEgressEnv" . | nindent 2 }}
  {{- if .Values.metrics.enabled}}
  METRIC_NAMESPACE: harbor
  METRIC_SUBSYSTEM: jobservice
  {{- end }}
  {{- template "harbor.trace.envs.jobservice" . }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ template "harbor.jobservice" . }}-env"
  labels:
    {{- include "harbor.componentLabels" (dict "root" . "component" "jobservice") | nindent 4 }}
  {{- with (include "harbor.annotations" (dict "root" . "local" nil)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- $jobserviceEnv := include "harbor.toEnvVars" (dict "values" (.Values.jobservice.env | default dict) "prefix" "" "isSecret" false) }}
  {{- include "harbor.mergedEnv" (list (include "harbor.jobservice.chartEnv" .) (include "harbor.globalEnv" .) $jobserviceEnv) | trim | nindent 2 }}
