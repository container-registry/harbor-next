{{- if .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harbor.fullname" . }}-grafana-dashboard
  {{- if .Values.metrics.grafanaDashboard.namespace }}
  namespace: {{ .Values.metrics.grafanaDashboard.namespace }}
  {{- end }}
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "harbor.annotations" (dict "root" . "local" .Values.metrics.grafanaDashboard.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  harbor.json: |-
    {{- .Files.Get "dashboards/harbor.json" | nindent 4 }}
{{- end }}
