apiVersion: v2
name: harbor
description: A modern, production-ready Helm chart for
  [Harbor distribution 8gcr](https://github.com/container-registry/8gcr) -
  the cloud-native
  container registry for Kubernetes.
type: application
version: 2.1.1
# appVersion is stamped by the app release commit through the marker below;
# version is stamped by the chart release PR on the same release branch.
appVersion: "v2.16.0"  # x-release-please-version
kubeVersion: ">=1.28.0-0"

home: https://github.com/container-registry/8gcr
icon: https://raw.githubusercontent.com/container-registry/8gcr/refs/heads/main/docs/img/8gcr-logo.svg
sources:
  - https://github.com/container-registry/8gcr

keywords:
  - harbor
  - container-registry
  - registry
  - oci
  - docker
  - artifacts
  - vulnerability-scanning
  - image-registry
  - cloud-native
  - cncf
  - helm

maintainers:
  - name: 8gcr Authors
    url: https://github.com/container-registry/8gcr

dependencies:
  - name: valkey
    version: "0.12.1"
    repository: "oci://ghcr.io/valkey-io/valkey-helm"
    condition: valkey.enabled
  - name: postgres
    alias: postgresql
    version: "0.21.2"
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: postgresql.enabled
  - name: harbor-scanner-grype
    version: "0.1.0"
    repository: "file://subcharts/harbor-scanner-grype"
    condition: harbor-scanner-grype.enabled
  - name: harbor-scanner-snyk
    version: "0.1.0"
    repository: "file://subcharts/harbor-scanner-snyk"
    condition: harbor-scanner-snyk.enabled

# Artifact Hub metadata (https://artifacthub.io/docs/topics/annotations/helm/).
# Keep this the LAST top-level key: the release pipeline appends the
# per-release artifacthub.io/images annotation to this block before
# packaging (image tags are only known at release time).
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/container-registry/8gcr
    - name: Source Helm Chart
      url: https://github.com/container-registry/8gcr/tree/main/deploy/chart
    - name: Migration from goharbor/harbor-helm
      url: https://github.com/container-registry/8gcr/blob/main/deploy/chart/docs/MIGRATION.md
    - name: Upstream Harbor
      url: https://goharbor.io
