# One-shot read-only diagnostics for the stuck 2026-08-29 redeploy.
# Publishes condensed pod/HelmRelease/CNPG/event/log state to ntfy.sh/bupd_agents
# (the operator's existing notification topic) since there is no kubeconfig
# off-cluster. Remove together with reset-2026-08-29.yaml once the tenant
# converges.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-debug
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-debug-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories, helmcharts]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-debug-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-debug-readonly
subjects:
  - kind: ServiceAccount
    name: harbor-debug
    namespace: flux-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-debug-20260829c
  namespace: flux-system
  labels:
    app.kubernetes.io/name: harbor-debug
    app.kubernetes.io/part-of: harbor
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-debug
        app.kubernetes.io/part-of: harbor
    spec:
      serviceAccountName: harbor-debug
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: debug
          image: docker.io/alpine/kubectl:1.33.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          command:
            - /bin/sh
            - -u
            - -c
            - |
              ns=8gcr-dev-main
              send() {
                head -c 3500 | curl -s -m 20 -H "Title: 8gcr-debug: $1" -d @- https://ntfy.sh/bupd_agents >/dev/null || true
              }
              pod=$(kubectl get pods -n "$ns" -o name 2>/dev/null | grep initdb | head -1)
              if [ -n "$pod" ]; then
                kubectl logs -n "$ns" "$pod" 2>&1 | grep -i -E 'error|fatal|syntax|permission|exception|failed' | tail -20 | send "initdb-errors"
                kubectl logs -n "$ns" "$pod" 2>&1 | tail -c 3400 | send "initdb-tail"
              else
                echo "no initdb pod found" | send "initdb-errors"
              fi
              echo done
