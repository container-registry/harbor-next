# One-shot factory reset of the 8gcr-dev tenant (2026-08-31 outage).
#
# Root cause (from the harbor-debug-20260831 diagnostics): the CNPG cluster
# never bootstrapped after the 2026-08-29 reset — the initdb Job died on the
# then-broken dollar-quoted postInitApplicationSQL and exhausted its backoff.
# CNPG only consumes spec.bootstrap at cluster creation, so the SQL fix in
# 7b103d7d can never take effect on the existing cluster; the HelmRelease is
# additionally Stalled (MissingRollbackTarget, zero successful releases).
# The current initdb SQL was re-validated against postgres:17 before this
# reset, including the event-trigger → row-trigger promotion chain.
#
# Deletes namespace 8gcr-dev-main; the harbor-8gcr Flux Kustomization
# (prune: true, 5m interval) then recreates everything in this bundle from
# scratch: fresh CNPG database (all migrations replay from zero, the demo
# admin-promotion trigger reinstalls via initdb), fresh registry/jobservice/
# trivy PVCs, fresh Helm install. Everything NOT in this bundle that lived in
# the namespace is gone for good — that is the point. No data is lost: the
# namespace is 46h old and Harbor core never became ready in its lifetime.
#
# These resources live in flux-system so the Job survives the namespace it
# deletes. The Job is immutable and runs once; REMOVE THIS FILE from the
# bundle after the redeploy converges so prune clears the Job and its RBAC,
# and a future re-bootstrap cannot wipe the tenant again.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-reset-0831
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-reset-8gcr-dev-main-0831
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, delete]
    resourceNames: [8gcr-dev-main]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-reset-8gcr-dev-main-0831
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-reset-8gcr-dev-main-0831
subjects:
  - kind: ServiceAccount
    name: harbor-reset-0831
    namespace: flux-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-reset-20260831
  namespace: flux-system
  labels:
    app.kubernetes.io/name: harbor-reset
    app.kubernetes.io/part-of: harbor
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-reset
        app.kubernetes.io/part-of: harbor
    spec:
      serviceAccountName: harbor-reset-0831
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reset
          image: docker.io/alpine/kubectl:1.33.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              notify() {
                printf '%s' "$1" | curl -s -m 20 -H "Title: 8gcr-reset-0831" --data-binary @- https://ntfy.sh/bupd_agents >/dev/null || true
              }
              notify "factory reset starting: deleting namespace 8gcr-dev-main"
              echo "Deleting namespace 8gcr-dev-main (factory reset) ..."
              if kubectl delete namespace 8gcr-dev-main --ignore-not-found --wait=true --timeout=25m; then
                notify "namespace 8gcr-dev-main deleted; Flux recreates the tenant on next reconcile (<=5m)"
              else
                notify "namespace deletion FAILED or timed out - manual attention needed"
                exit 1
              fi
              echo "Namespace gone. Flux will recreate the tenant on its next reconcile."
