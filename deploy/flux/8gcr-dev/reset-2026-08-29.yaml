# One-shot factory reset of the 8gcr-dev tenant (2026-08-29).
#
# Deletes namespace 8gcr-dev-main; the harbor-8gcr Flux Kustomization
# (prune: true, 5m interval) then recreates everything in this bundle from
# scratch: fresh CNPG database (all migrations replay from zero, the demo
# admin-promotion trigger reinstalls via initdb), fresh registry/jobservice/
# trivy PVCs, fresh Helm install. Everything NOT in this bundle that lived in
# the namespace is gone for good — that is the point.
#
# These resources live in flux-system so the Job survives the namespace it
# deletes. The Job is immutable and runs once; REMOVE THIS FILE from the
# bundle after the redeploy converges so prune clears the Job and its RBAC,
# and a future re-bootstrap cannot wipe the tenant again.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-reset
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-reset-8gcr-dev-main
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, delete]
    resourceNames: [8gcr-dev-main]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-reset-8gcr-dev-main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-reset-8gcr-dev-main
subjects:
  - kind: ServiceAccount
    name: harbor-reset
    namespace: flux-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-reset-20260829
  namespace: flux-system
  labels:
    app.kubernetes.io/name: harbor-reset
    app.kubernetes.io/part-of: harbor
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-reset
        app.kubernetes.io/part-of: harbor
    spec:
      serviceAccountName: harbor-reset
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reset
          image: docker.io/alpine/kubectl:1.33.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              echo "Deleting namespace 8gcr-dev-main (factory reset) ..."
              kubectl delete namespace 8gcr-dev-main --ignore-not-found --wait=true --timeout=25m
              echo "Namespace gone. Flux will recreate the tenant on its next reconcile."
