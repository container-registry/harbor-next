# Flux 2.10 object identity: source-controller mints a token for this ServiceAccount
# and Harbor maps it to a federated robot by its namespace claim. No pull secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-oci
  namespace: 8gcr-dev-main
  annotations:
    credential.auth.fluxcd.io/provider: kubernetes
    credential.auth.fluxcd.io/type: jwt
    credential.auth.fluxcd.io/audiences: container-registry.com
    credential.auth.fluxcd.io/username: jwt
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: harbor-chart
  namespace: 8gcr-dev-main
spec:
  interval: 5m
  url: oci://8gears.container-registry.com/8gcr/charts/harbor
  ref:
    semver: ">=2.0.0"
  provider: generic
  serviceAccountName: flux-oci
