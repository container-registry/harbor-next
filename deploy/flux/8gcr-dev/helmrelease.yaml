apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: 8gcr-dev-main
spec:
  interval: 10m
  releaseName: harbor
  chartRef:
    kind: OCIRepository
    name: harbor-next-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    externalURL: https://8gcr.container-registry.dev
    logLevel: info
    image:
      pullPolicy: Always
    imagePullSecrets:
      - name: harbor-system-pull
    # Admin password provisioned by secrets.sops.yaml in this bundle.
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    expose:
      clusterIP: {enabled: false}
      nodePort: {enabled: false}
      loadBalancer: {enabled: false}
      route: {enabled: false}
    ingress:
      enabled: true
      className: nginx
      autoGenCert: false
      core: 8gcr.container-registry.dev
      hosts:
        - host: 8gcr.container-registry.dev
      tls:
        - secretName: harbor-tls
          hosts:
            - 8gcr.container-registry.dev
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
    # ---- Database ----
    # Both CNPG bootstrap (extraManifests below) and Harbor's runtime DB client
    # read the SAME Secret/harbor-db-password. CNPG requires basic-auth type
    # (keys: username, password); Harbor's chart reads .password via
    # existingSecretKey. One secret, one source of truth — no drift between
    # bootstrap and runtime.
    database:
      host: harbor-db-rw.8gcr-dev-main.svc.cluster.local
      port: 5432
      username: harbor
      database: registry
      sslmode: disable
      existingSecret: harbor-db-password
      existingSecretKey: password
    # ---- Valkey (in-chart, default standalone) ----
    valkey:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
    # ---- Component image pins (continuous deploy via 8gcr/:latest) ----
    # Flux image automation follows each mutable latest tag by digest and
    # rewrites these pod-template annotations in this branch. The branch push
    # then publishes the bundle to ops/hz-hopper/8gcr-rolling, Flux applies the
    # changed HelmRelease, and Kubernetes restarts pods with imagePullPolicy:
    # Always so they pull the new digest behind latest.
    core:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:c4654b7c9992dfc4582505f547bf5586db06c6d694ff61a56ff321752dafa77e" # {"$imagepolicy": "flux-system:harbor-core:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-core
        tag: latest
      replicas: 1
      # The chart's core ConfigMap hardcodes this to the OCI providers only, so
      # binding a project to an npm or Maven endpoint is rejected with
      # "unsupported registry type npm" even though the adapters are registered
      # and the endpoints report healthy. env overrides envFrom for a duplicate
      # key, so this wins over the ConfigMap without a chart change.
      #
      # The list is the chart's own default plus the package formats the build
      # supports; dropping any of the originals would break existing proxy
      # projects.
      extraEnv:
        - name: PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE
          value: "docker-hub,harbor,azure-acr,ali-acr,aws-ecr,google-gcr,docker-registry,github-ghcr,jfrog-artifactory,npm,pypi,maven,cargo,go,go-sumdb,homebrew"
    jobservice:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:e5ea4808882b07ff99cd17216be133c351e89aee342565f35e4f135addf8ff43" # {"$imagepolicy": "flux-system:harbor-jobservice:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-jobservice
        tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 1Gi
    registry:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:36e19a4f95cbba77fea1a711b2da034e2c14a444c8915b39b69ea46d73595ab5" # {"$imagepolicy": "flux-system:harbor-registry:digest"}
        deploy.8gears.io/registryctl-image-revision: "sha256:b76ad543b8b3ad1b4d3f0de8d16a8bcf6a0791332f485be7431d15d8d5dc0418" # {"$imagepolicy": "flux-system:harbor-registryctl:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-registry
        tag: latest
      controller:
        image:
          repository: 8gears.container-registry.com/8gcr/harbor-registryctl
          tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
    portal:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:78b04fe3c76d94e665bedc597c779e7d051daaaabd210aeb62e73920688aff17" # {"$imagepolicy": "flux-system:harbor-portal:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-portal
        tag: latest
      replicas: 1
    exporter:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:c63e00de82c3a0d6a9be33ae4bf1ca142f39e0080a66c0a84bcbdff8a12baf5b" # {"$imagepolicy": "flux-system:harbor-exporter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-exporter
        tag: latest
      replicas: 1
    trivy:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:ee03509cb2e8af5ecf08aeb373dee3742b0dc36dc6f70d6040e00eb5e8be005c" # {"$imagepolicy": "flux-system:trivy-adapter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/trivy-adapter
        tag: latest
      replicas: 1
    # ---- CNPG Postgres provisioned via the chart's extraManifests escape hatch ----
    # The harbor-db-password Secret it references is provisioned out-of-band
    # (SOPS-encrypted in k8s/apps); must contain keys: username, password.
    extraManifests:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: harbor-db
        spec:
          imageName: ghcr.io/cloudnative-pg/postgresql:17
          instances: 1
          storage:
            size: 5Gi
          bootstrap:
            initdb:
              database: registry
              owner: harbor
              secret:
                name: harbor-db-password
