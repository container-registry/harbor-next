apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: 8gcr-dev-main
spec:
  interval: 10m
  releaseName: harbor
  chartRef:
    kind: OCIRepository
    name: harbor-next-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    externalURL: https://8gcr.container-registry.dev
    logLevel: info
    image:
      pullPolicy: Always
    imagePullSecrets:
      - name: harbor-system-pull
    # Admin password provisioned by secrets.sops.yaml in this bundle.
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    expose:
      clusterIP: {enabled: false}
      nodePort: {enabled: false}
      loadBalancer: {enabled: false}
      route: {enabled: false}
    ingress:
      enabled: true
      className: nginx
      autoGenCert: false
      core: 8gcr.container-registry.dev
      hosts:
        - host: 8gcr.container-registry.dev
      tls:
        - secretName: harbor-tls
          hosts:
            - 8gcr.container-registry.dev
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
    # ---- Database ----
    # Both CNPG bootstrap (extraManifests below) and Harbor's runtime DB client
    # read the SAME Secret/harbor-db-password. CNPG requires basic-auth type
    # (keys: username, password); Harbor's chart reads .password via
    # existingSecretKey. One secret, one source of truth — no drift between
    # bootstrap and runtime.
    database:
      host: harbor-db-rw.8gcr-dev-main.svc.cluster.local
      port: 5432
      username: harbor
      database: registry
      sslmode: disable
      existingSecret: harbor-db-password
      existingSecretKey: password
    # ---- Valkey (in-chart, default standalone) ----
    valkey:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
    # ---- Component image pins (continuous deploy via 8gcr/:latest) ----
    # Flux image automation follows each mutable latest tag by digest and
    # rewrites these pod-template annotations in this branch. The branch push
    # then publishes the bundle to ops/hz-hopper/8gcr-rolling, Flux applies the
    # changed HelmRelease, and Kubernetes restarts pods with imagePullPolicy:
    # Always so they pull the new digest behind latest.
    core:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:a634d89d00b4589009d0b6693e05c0b5f89faccc0464c0b90d0b4d26d126d857" # {"$imagepolicy": "flux-system:harbor-core:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-core
        tag: latest
      replicas: 1
    jobservice:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:fa44940f5fcc5e7f5ce7546d71f22c62a1b08bf205d08897352ad6661cab6992" # {"$imagepolicy": "flux-system:harbor-jobservice:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-jobservice
        tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 1Gi
    registry:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:de12b1fd47e6fd17404d4e3182101982103b069889fae12d61ea9d97ec564021" # {"$imagepolicy": "flux-system:harbor-registry:digest"}
        deploy.8gears.io/registryctl-image-revision: "sha256:6008fc2094eb81a353486e826926c85f30eaa7926c080e0c2928ba6735663ce4" # {"$imagepolicy": "flux-system:harbor-registryctl:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-registry
        tag: latest
      controller:
        image:
          repository: 8gears.container-registry.com/8gcr/harbor-registryctl
          tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
    portal:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:519a6601dd4bcee0b22683a5e683d70d4ae0fcc83f32fe75cfd80906240e6eff" # {"$imagepolicy": "flux-system:harbor-portal:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-portal
        tag: latest
      replicas: 1
    exporter:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:a96d012f3c160385efebcbd5771d65171ead0fe6e201adac7e29ae35e5c08751" # {"$imagepolicy": "flux-system:harbor-exporter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-exporter
        tag: latest
      replicas: 1
    trivy:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:d907af5a009d8301ed87c6e6b9a400335e99637203329fda82ba5dd378ce27cf" # {"$imagepolicy": "flux-system:trivy-adapter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/trivy-adapter
        tag: latest
      replicas: 1
    # ---- CNPG Postgres provisioned via the chart's extraManifests escape hatch ----
    # The harbor-db-password Secret it references is provisioned out-of-band
    # (SOPS-encrypted in k8s/apps); must contain keys: username, password.
    extraManifests:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: harbor-db
        spec:
          imageName: ghcr.io/cloudnative-pg/postgresql:17
          instances: 1
          storage:
            size: 5Gi
          bootstrap:
            initdb:
              database: registry
              owner: harbor
              secret:
                name: harbor-db-password
