apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: 8gcr-dev-main
spec:
  interval: 10m
  releaseName: harbor
  chartRef:
    kind: OCIRepository
    name: harbor-next-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    externalURL: https://8gcr.container-registry.dev
    logLevel: info
    image:
      pullPolicy: Always
    imagePullSecrets:
      - name: harbor-system-pull
    # Admin password provisioned by secrets.sops.yaml in this bundle.
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    expose:
      clusterIP: {enabled: false}
      nodePort: {enabled: false}
      loadBalancer: {enabled: false}
      route: {enabled: false}
    ingress:
      enabled: true
      className: nginx
      autoGenCert: false
      core: 8gcr.container-registry.dev
      hosts:
        - host: 8gcr.container-registry.dev
      tls:
        - secretName: harbor-tls
          hosts:
            - 8gcr.container-registry.dev
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
    # ---- Database ----
    # Both CNPG bootstrap (extraManifests below) and Harbor's runtime DB client
    # read the SAME Secret/harbor-db-password. CNPG requires basic-auth type
    # (keys: username, password); Harbor's chart reads .password via
    # existingSecretKey. One secret, one source of truth — no drift between
    # bootstrap and runtime.
    database:
      host: harbor-db-rw.8gcr-dev-main.svc.cluster.local
      port: 5432
      username: harbor
      database: registry
      sslmode: disable
      existingSecret: harbor-db-password
      existingSecretKey: password
    # ---- Valkey (in-chart, default standalone) ----
    valkey:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
    # ---- Component image pins (continuous deploy via 8gcr/:latest) ----
    # Flux image automation follows each mutable latest tag by digest and
    # rewrites these pod-template annotations in this branch. The branch push
    # then publishes the bundle to ops/hz-hopper/8gcr-rolling, Flux applies the
    # changed HelmRelease, and Kubernetes restarts pods with imagePullPolicy:
    # Always so they pull the new digest behind latest.
    core:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:d3aa187387ebf9fefe9862360e8e78a84ac90d5e00788544933048a6ef90f8b1" # {"$imagepolicy": "flux-system:harbor-core:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-core
        tag: latest
      replicas: 1
    jobservice:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:4bd1fe05bfa098da29d7cdb05c6d29fb0c019daaf3dfc298a2f03655feca2e58" # {"$imagepolicy": "flux-system:harbor-jobservice:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-jobservice
        tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 1Gi
    registry:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:4b8942f7ec3592ca0fe0bf936b33e360fe211e64d9affbb086619ee3df97dc7f" # {"$imagepolicy": "flux-system:harbor-registry:digest"}
        deploy.8gears.io/registryctl-image-revision: "sha256:62ed1ecd6eb8c3faf1a1d24d155395f27bcb18b2b5d4a5fb327d7e9a5535fb31" # {"$imagepolicy": "flux-system:harbor-registryctl:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-registry
        tag: latest
      controller:
        image:
          repository: 8gears.container-registry.com/8gcr/harbor-registryctl
          tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
    portal:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:7e139b9555e0b8976acb41889ecd8bec77fa1190f5bf19257cf8f240cd533608" # {"$imagepolicy": "flux-system:harbor-portal:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-portal
        tag: latest
      replicas: 1
    exporter:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:0bd7660585838b28fe25558ab6f6260a7e0600ba46929701579d676a24e45fdd" # {"$imagepolicy": "flux-system:harbor-exporter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-exporter
        tag: latest
      replicas: 1
    trivy:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:329ee969fbe1a3bf70ce6e35fc82b0a0ae5da9b46da5ff3d71d676abb3153513" # {"$imagepolicy": "flux-system:trivy-adapter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/trivy-adapter
        tag: latest
      replicas: 1
    # ---- CNPG Postgres provisioned via the chart's extraManifests escape hatch ----
    # The harbor-db-password Secret it references is provisioned out-of-band
    # (SOPS-encrypted in k8s/apps); must contain keys: username, password.
    extraManifests:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: harbor-db
        spec:
          imageName: ghcr.io/cloudnative-pg/postgresql:17
          instances: 1
          storage:
            size: 5Gi
          bootstrap:
            initdb:
              database: registry
              owner: harbor
              secret:
                name: harbor-db-password
