apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: 8gcr-dev-main
spec:
  interval: 10m
  releaseName: harbor
  chartRef:
    kind: OCIRepository
    name: harbor-next-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    externalURL: https://8gcr.container-registry.dev
    logLevel: info
    image:
      pullPolicy: Always
    imagePullSecrets:
      - name: harbor-system-pull
    # Admin password provisioned by secrets.sops.yaml in this bundle.
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    expose:
      clusterIP: {enabled: false}
      nodePort: {enabled: false}
      loadBalancer: {enabled: false}
      route: {enabled: false}
    ingress:
      enabled: true
      className: nginx
      autoGenCert: false
      core: 8gcr.container-registry.dev
      hosts:
        - host: 8gcr.container-registry.dev
      tls:
        - secretName: harbor-tls
          hosts:
            - 8gcr.container-registry.dev
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
    # ---- Database ----
    # Both CNPG bootstrap (extraManifests below) and Harbor's runtime DB client
    # read the SAME Secret/harbor-db-password. CNPG requires basic-auth type
    # (keys: username, password); Harbor's chart reads .password via
    # existingSecretKey. One secret, one source of truth — no drift between
    # bootstrap and runtime.
    database:
      host: harbor-db-rw.8gcr-dev-main.svc.cluster.local
      port: 5432
      username: harbor
      database: registry
      sslmode: disable
      existingSecret: harbor-db-password
      existingSecretKey: password
    # ---- Valkey (in-chart, default standalone) ----
    valkey:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
    # ---- Component image pins (continuous deploy via 8gcr/:latest) ----
    # Flux image automation follows each mutable latest tag by digest and
    # rewrites these pod-template annotations in this branch. The branch push
    # then publishes the bundle to ops/hz-hopper/8gcr-rolling, Flux applies the
    # changed HelmRelease, and Kubernetes restarts pods with imagePullPolicy:
    # Always so they pull the new digest behind latest.
    core:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:81ffae02a85b205608734bf663f0b56ec67ea4ab38e7e16daac92d6ab64934c0" # {"$imagepolicy": "flux-system:harbor-core:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-core
        tag: latest
      replicas: 1
      # The chart's core ConfigMap hardcodes this to the OCI providers only, so
      # binding a project to an npm or Maven endpoint is rejected with
      # "unsupported registry type npm" even though the adapters are registered
      # and the endpoints report healthy. env overrides envFrom for a duplicate
      # key, so this wins over the ConfigMap without a chart change.
      #
      # The list is the chart's own default plus the package formats the build
      # supports; dropping any of the originals would break existing proxy
      # projects.
      extraEnv:
        - name: PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE
          value: "docker-hub,harbor,azure-acr,ali-acr,aws-ecr,google-gcr,docker-registry,github-ghcr,jfrog-artifactory,npm,npmjs,pypi,pypi-registry,maven,maven-central,cargo,crates-io,go,go-registry,go-sumdb,homebrew,homebrew-registry"
        - name: WITH_SNYK
          value: "true"
        - name: SNYK_ADAPTER_URL
          value: http://snyk-scanner:8080
        - name: WITH_GRYPE
          value: "true"
        - name: GRYPE_ADAPTER_URL
          value: http://grype-scanner:8080
        - name: DEFAULT_SCANNER
          value: Trivy
    jobservice:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:5c3e09cdf1bef7a388637620a533a2813aba92c41212bd85235ef08789a59d79" # {"$imagepolicy": "flux-system:harbor-jobservice:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-jobservice
        tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 1Gi
    registry:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:b38503046e1a24fa78122dd879e8a50a137e5f638604963d831043f8f6e87ced" # {"$imagepolicy": "flux-system:harbor-registry:digest"}
        deploy.8gears.io/registryctl-image-revision: "sha256:0216ec030b79bb4dbc1208f2d976ec26ccbe58845ee1fd1702d77b8ffc81a938" # {"$imagepolicy": "flux-system:harbor-registryctl:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-registry
        tag: latest
      controller:
        image:
          repository: 8gears.container-registry.com/8gcr/harbor-registryctl
          tag: latest
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
    portal:
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:2e3a0289a009a1d157c620cc081af619346d0f1a4e9a08eb8896546ef84260ec" # {"$imagepolicy": "flux-system:harbor-portal:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-portal
        tag: latest
      replicas: 1
    exporter:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:907513a025db9118dfb81a40a696f165f4101cb722b37a560a16b6537a9f12d2" # {"$imagepolicy": "flux-system:harbor-exporter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/harbor-exporter
        tag: latest
      replicas: 1
    trivy:
      enabled: true
      podAnnotations:
        deploy.8gears.io/image-revision: "sha256:ee03509cb2e8af5ecf08aeb373dee3742b0dc36dc6f70d6040e00eb5e8be005c" # {"$imagepolicy": "flux-system:trivy-adapter:digest"}
      image:
        repository: 8gears.container-registry.com/8gcr/trivy-adapter
        tag: latest
      replicas: 1
    # ---- CNPG Postgres provisioned via the chart's extraManifests escape hatch ----
    # The harbor-db-password Secret it references is provisioned out-of-band
    # (SOPS-encrypted in k8s/apps); must contain keys: username, password.
    extraManifests:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: harbor-db
        spec:
          imageName: ghcr.io/cloudnative-pg/postgresql:17
          instances: 1
          storage:
            size: 5Gi
          bootstrap:
            initdb:
              database: registry
              owner: harbor
              secret:
                name: harbor-db-password
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: grype-scanner
          labels:
            app.kubernetes.io/name: grype-scanner
            app.kubernetes.io/component: scanner
            app.kubernetes.io/part-of: harbor
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: grype-scanner
          template:
            metadata:
              annotations:
                deploy.8gears.io/image-revision: "sha256:a8df49760cab2dea86c7f0bb2976f06f072846a4d86ba82ee18943a9c8704104" # {"$imagepolicy": "flux-system:harbor-grype-adapter:digest"}
              labels:
                app.kubernetes.io/name: grype-scanner
                app.kubernetes.io/component: scanner
                app.kubernetes.io/part-of: harbor
            spec:
              imagePullSecrets:
                - name: harbor-system-pull
              securityContext:
                fsGroup: 101
                fsGroupChangePolicy: OnRootMismatch
                runAsGroup: 101
                runAsNonRoot: true
                runAsUser: 100
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: scanner
                  image: 8gears.container-registry.com/8gcr/harbor-grype-adapter:latest
                  imagePullPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    runAsNonRoot: true
                  env:
                    - name: SCANNER_API_SERVER_ADDR
                      value: ":8080"
                    - name: SCANNER_GRYPE_CACHE_DIR
                      value: /home/scanner/cache
                    - name: SCANNER_GRYPE_DB_CACHE_DIR
                      value: /home/scanner/cache/grype-db
                    - name: SCANNER_GRYPE_SCOPE
                      value: squashed
                  ports:
                    - name: http
                      containerPort: 8080
                  readinessProbe:
                    httpGet:
                      path: /probe/ready
                      port: http
                  livenessProbe:
                    httpGet:
                      path: /probe/healthy
                      port: http
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 2Gi
                  volumeMounts:
                    - name: cache
                      mountPath: /home/scanner/cache
                    - name: tmp
                      mountPath: /tmp
              volumes:
                - name: cache
                  emptyDir:
                    sizeLimit: 4Gi
                - name: tmp
                  emptyDir:
                    sizeLimit: 2Gi
      - apiVersion: v1
        kind: Service
        metadata:
          name: grype-scanner
          labels:
            app.kubernetes.io/name: grype-scanner
            app.kubernetes.io/component: scanner
            app.kubernetes.io/part-of: harbor
        spec:
          selector:
            app.kubernetes.io/name: grype-scanner
          ports:
            - name: http
              port: 8080
              targetPort: http
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: snyk-scanner
          labels:
            app.kubernetes.io/name: snyk-scanner
            app.kubernetes.io/component: scanner
            app.kubernetes.io/part-of: harbor
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: snyk-scanner
          template:
            metadata:
              annotations:
                deploy.8gears.io/image-revision: "sha256:3e5c95eb47e65b4d2a2cef51012c53f9d2cfb12f07ea4fa65ed1debc74adf8da" # {"$imagepolicy": "flux-system:harbor-snyk-adapter:digest"}
              labels:
                app.kubernetes.io/name: snyk-scanner
                app.kubernetes.io/component: scanner
                app.kubernetes.io/part-of: harbor
            spec:
              imagePullSecrets:
                - name: harbor-system-pull
              securityContext:
                fsGroup: 101
                fsGroupChangePolicy: OnRootMismatch
                runAsGroup: 101
                runAsNonRoot: true
                runAsUser: 100
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: scanner
                  image: 8gears.container-registry.com/8gcr/harbor-snyk-adapter:latest
                  imagePullPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    runAsNonRoot: true
                  env:
                    - name: SCANNER_API_SERVER_ADDR
                      value: ":8080"
                    - name: SCANNER_SNYK_CACHE_DIR
                      value: /tmp
                    - name: SNYK_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: harbor-snyk
                          key: token
                    - name: SNYK_ORG
                      valueFrom:
                        secretKeyRef:
                          name: harbor-snyk
                          key: org
                          optional: true
                  ports:
                    - name: http
                      containerPort: 8080
                  readinessProbe:
                    httpGet:
                      path: /probe/ready
                      port: http
                  livenessProbe:
                    httpGet:
                      path: /probe/healthy
                      port: http
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 2Gi
                  volumeMounts:
                    - name: tmp
                      mountPath: /tmp
              volumes:
                - name: tmp
                  emptyDir:
                    sizeLimit: 2Gi
      - apiVersion: v1
        kind: Service
        metadata:
          name: snyk-scanner
          labels:
            app.kubernetes.io/name: snyk-scanner
            app.kubernetes.io/component: scanner
            app.kubernetes.io/part-of: harbor
        spec:
          selector:
            app.kubernetes.io/name: snyk-scanner
          ports:
            - name: http
              port: 8080
              targetPort: http
