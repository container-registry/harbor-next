# One-shot read-only observer for NP-16 (verify latest-image auto-rollout).
# Every 10 min: publishes each ImagePolicy digest, the digest annotation on
# every workload, and pod start times to ntfy.sh/bupd_agents (no kubeconfig
# off-cluster). Strictly read-only. Remove once NP-16 verification completes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: np16-observe
  namespace: 8gcr-dev-main
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: np16-observe-imagepolicies
  namespace: flux-system
rules:
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagepolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: np16-observe-imagepolicies
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: np16-observe-imagepolicies
subjects:
  - kind: ServiceAccount
    name: np16-observe
    namespace: 8gcr-dev-main
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: np16-observe-workloads
  namespace: 8gcr-dev-main
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: np16-observe-workloads
  namespace: 8gcr-dev-main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: np16-observe-workloads
subjects:
  - kind: ServiceAccount
    name: np16-observe
    namespace: 8gcr-dev-main
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: np16-observe
  namespace: 8gcr-dev-main
  labels:
    app.kubernetes.io/name: np16-observe
    app.kubernetes.io/part-of: harbor
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: np16-observe
            app.kubernetes.io/part-of: harbor
        spec:
          serviceAccountName: np16-observe
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: observe
              image: docker.io/alpine/kubectl:1.33.4
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              command:
                - /bin/sh
                - -u
                - -c
                - |
                  ns_app=8gcr-dev-main
                  ns_flux=flux-system
                  short() { cut -c8-19; }
                  {
                    echo "policies:"
                    for p in harbor-core harbor-jobservice harbor-registry harbor-registryctl harbor-portal harbor-exporter trivy-adapter harbor-grype-adapter; do
                      d=$(kubectl get imagepolicies.image.toolkit.fluxcd.io "$p" -n "$ns_flux" -o jsonpath='{.status.latestRef.digest}' 2>/dev/null)
                      echo "  $p ${d:-none}" | sed 's/sha256://'
                    done
                    echo "annotations:"
                    for w in deployment/harbor-harbor-next-core deployment/harbor-harbor-next-jobservice deployment/harbor-harbor-next-registry deployment/harbor-harbor-next-portal deployment/harbor-harbor-next-exporter statefulset/harbor-harbor-next-trivy deployment/grype-scanner; do
                      a=$(kubectl get "$w" -n "$ns_app" -o jsonpath="{.spec.template.metadata.annotations['deploy\.8gears\.io/image-revision']}" 2>/dev/null)
                      echo "  $w ${a:-none}" | sed 's/sha256://'
                    done
                    rc=$(kubectl get deployment harbor-harbor-next-registry -n "$ns_app" -o jsonpath="{.spec.template.metadata.annotations['deploy\.8gears\.io/registryctl-image-revision']}" 2>/dev/null)
                    echo "  registryctl-anno ${rc:-none}" | sed 's/sha256://'
                    echo "pods:"
                    kubectl get pods -n "$ns_app" -o jsonpath='{range .items[*]}{"  "}{.metadata.name}{" "}{.status.phase}{" "}{.status.startTime}{"\n"}{end}' 2>/dev/null | grep -v np16-observe
                  } | head -c 3800 | curl -s -m 20 -H "Title: np16-observe $(date -u +%H:%M)" --data-binary @- https://ntfy.sh/bupd_agents >/dev/null || true
                  echo done
