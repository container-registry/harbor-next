apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# bootstrap.yaml is intentionally NOT listed here — it's the one-time
# kubectl-apply entry point that creates the Flux Kustomization which
# reconciles this directory. Reconciling it from inside would be circular.
resources:
  - namespace.yaml
  - secrets.sops.yaml
  - pull-secret-flux-system.sops.yaml
  - pull-secret-8gcr-dev-main.sops.yaml
  - ocirepository.yaml
  - image-tracking.yaml
  - rollout-sync.yaml
  - helmrelease.yaml
  - ingress-packages.yaml
  # One-shot tenant wipe — remove after the 2026-08-29 redeploy converges.
  - reset-2026-08-29.yaml
  # One-shot stuck-redeploy diagnostics — remove together with the reset file.
  - debug-2026-08-29.yaml
