name: ${COMPOSE_PROJECT_NAME:-harbor-bootc}

services:
  portal:
    image: ${IMAGE_REPO:-}harbor-portal${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    volumes:
      - ./config/proxy.conf:/etc/nginx/proxy.d/proxy.conf:ro,z
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT_HTTP:-18085}:8080"
    depends_on:
      - core
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8080"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  core:
    image: ${IMAGE_REPO:-}harbor-core${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./config/token_service_key.pem:/etc/core/token_service_key.pem:ro,z
    environment:
      POSTGRESQL_HOST: postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${DB_USER:-postgres}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: ${DB_NAME:-registry}
      POSTGRESQL_SSLMODE: ${DB_SSLMODE:-disable}
      _REDIS_URL_CORE: redis://redis:6379/0
      _REDIS_URL_REG: redis://redis:6379/1
      REGISTRY_URL: http://registry:5000
      REGISTRY_CONTROLLER_URL: http://registryctl:8080
      REGISTRY_CREDENTIAL_USERNAME: ${REGISTRY_CREDENTIAL_USERNAME:-}
      REGISTRY_CREDENTIAL_PASSWORD: ${REGISTRY_CREDENTIAL_PASSWORD:-}
      EXT_ENDPOINT: ${EXT_ENDPOINT}
      CSRF_KEY: ${CSRF_KEY}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORE_URL: http://core:8080
      HARBOR_ADMIN_PASSWORD: ${HARBOR_ADMIN_PASSWORD}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TOKEN_PRIVATE_KEY_PATH: /etc/core/token_service_key.pem
      JOBSERVICE_URL: http://jobservice:8888
      CORE_SECRET: ${CORE_SECRET}
      JOBSERVICE_SECRET: ${JOBSERVICE_SECRET}
      TRIVY_ADAPTER_URL: http://trivy-adapter:8080
      WITH_TRIVY: ${WITH_TRIVY:-true}
      GRYPE_ADAPTER_URL: http://grype-scanner:8080
      WITH_GRYPE: ${WITH_GRYPE:-false}
      WITH_SNYK: ${WITH_SNYK:-false}
      DEFAULT_SCANNER: ${DEFAULT_SCANNER:-}
      PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE: docker-hub,harbor,azure-acr,ali-acr,aws-ecr,google-gcr,docker-registry,github-ghcr,jfrog-artifactory,npmjs,npm,maven-central,maven,pypi,pypi-registry,crates-io,cargo,go,go-registry,go-sumdb,homebrew,homebrew-registry
      REPLICATION_ADAPTER_WHITELIST: ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr,npmjs,npm,maven-central,maven,pypi,pypi-registry,crates-io,cargo,go,go-registry,go-sumdb,homebrew,homebrew-registry
    depends_on:
      - postgresql
      - redis
      - registry
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8080", "-endpoint", "/api/v2.0/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  jobservice:
    image: ${IMAGE_REPO:-}harbor-jobservice${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./config/jobservice.yml:/etc/jobservice/config.yml:ro,z
    environment:
      POSTGRESQL_HOST: postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${DB_USER:-postgres}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: ${DB_NAME:-registry}
      POSTGRESQL_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_URL: redis://redis:6379
      CORE_URL: http://core:8080
      CORE_SECRET: ${CORE_SECRET}
      JOBSERVICE_SECRET: ${JOBSERVICE_SECRET}
      REGISTRY_URL: http://registry:5000
      REGISTRY_CONTROLLER_URL: http://registryctl:8080
      REGISTRY_CREDENTIAL_USERNAME: ${REGISTRY_CREDENTIAL_USERNAME:-}
      REGISTRY_CREDENTIAL_PASSWORD: ${REGISTRY_CREDENTIAL_PASSWORD:-}
      TOKEN_SERVICE_URL: http://core:8080/service/token
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - core
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8888", "-endpoint", "/api/v1/stats"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  registryctl:
    image: ${IMAGE_REPO:-}harbor-registryctl${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./config/registryctl.yml:/etc/registryctl/config.yml:ro,z
      - ./config/registry.yml:/etc/registry/config.yml:ro,z
      - registry-data:/var/lib/registry
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REGISTRY_CONFIG: /etc/registry/config.yml
      CORE_SECRET: ${CORE_SECRET}
      JOBSERVICE_SECRET: ${JOBSERVICE_SECRET}
    depends_on:
      - registry
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8080", "-endpoint", "/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  registry:
    image: ${IMAGE_REPO:-}harbor-registry${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./config/registry.yml:/etc/registry/config.yml:ro,z
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_HTTP_SECRET: ${CORE_SECRET}
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "5001", "-endpoint", "/debug/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  trivy-adapter:
    image: ${IMAGE_REPO:-}harbor-trivy-adapter${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    environment:
      SCANNER_LOG_LEVEL: ${LOG_LEVEL:-info}
      SCANNER_REDIS_URL: redis://redis:6379/5
      SCANNER_STORE_REDIS_URL: redis://redis:6379/5
      SCANNER_STORE_REDIS_NAMESPACE: harbor.scanner.trivy:store
      SCANNER_JOB_QUEUE_REDIS_URL: redis://redis:6379/5
      SCANNER_JOB_QUEUE_REDIS_NAMESPACE: harbor.scanner.trivy:job-queue
      SCANNER_TRIVY_CACHE_DIR: /home/scanner/.cache/trivy
      SCANNER_TRIVY_REPORTS_DIR: /home/scanner/.cache/reports
      SCANNER_TRIVY_VULN_TYPE: os
      SCANNER_TRIVY_SECURITY_CHECKS: vuln
      SCANNER_TRIVY_SEVERITY: ${SCANNER_TRIVY_SEVERITY:-CRITICAL}
      SCANNER_TRIVY_IGNORE_UNFIXED: "false"
      SCANNER_TRIVY_TIMEOUT: 30m0s
      SCANNER_API_SERVER_ADDR: ":8080"
    volumes:
      - ./runtime/trivy-tmp:/tmp:z
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8080", "-endpoint", "/probe/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grype-scanner:
    image: ${IMAGE_REPO:-}harbor-grype-adapter${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    environment:
      SCANNER_API_SERVER_ADDR: ":8080"
      SCANNER_GRYPE_CACHE_DIR: /home/scanner/cache
      SCANNER_GRYPE_DB_CACHE_DIR: /home/scanner/cache/grype-db
      SCANNER_GRYPE_MAX_CONCURRENCY: 1
      SCANNER_GRYPE_SCOPE: squashed
      SCANNER_SYFT_CATALOGERS: rpm-db-cataloger,alpm-db-cataloger,dpkg-db-cataloger,apk-db-cataloger
      SCANNER_SYFT_PARALLELISM: 1
    tmpfs:
      - /tmp:size=2G,mode=1777
    volumes:
      - ./runtime/grype-cache:/home/scanner/cache:U,z
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8080", "-endpoint", "/probe/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  exporter:
    image: ${IMAGE_REPO:-}harbor-exporter${IMAGE_SUFFIX:-}:${HARBOR_TAG}
    tmpfs:
      - /tmp:size=256M,mode=1777
    environment:
      HARBOR_DATABASE_HOST: postgresql
      HARBOR_DATABASE_PORT: "5432"
      HARBOR_DATABASE_USERNAME: ${DB_USER:-postgres}
      HARBOR_DATABASE_PASSWORD: ${DB_PASSWORD}
      HARBOR_DATABASE_DBNAME: ${DB_NAME:-registry}
      HARBOR_DATABASE_SSLMODE: ${DB_SSLMODE:-disable}
      HARBOR_EXPORTER_METRICS_PATH: /metrics
      HARBOR_EXPORTER_PORT: "8080"
      HARBOR_SERVICE_HOST: core
      HARBOR_SERVICE_PORT: "8080"
      HARBOR_SERVICE_SCHEME: http
      HARBOR_REDIS_URL: redis://redis:6379/2
      HARBOR_REDIS_NAMESPACE: harbor_job_service_namespace
      HARBOR_REDIS_TIMEOUT: "3600"
    depends_on:
      - core
    healthcheck:
      test: ["CMD", "/lprobe", "-port", "8080", "-endpoint", "/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgresql:
    image: docker.io/library/postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-registry}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: valkey/valkey:${VALKEY_VERSION:-8}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  registry-data:
