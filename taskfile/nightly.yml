# Nightly release channel.
#
# A nightly is the real release pipeline run against a throwaway branch: the
# same release-please configuration, the same reusable image workflow, the same
# release-notes engine. Nothing here reimplements the release — the only thing
# this file owns is materializing tonight's release-please channel.
#
# The channel branch is rebuilt from the release line's head every night, so
# the nightly manifest is re-seeded from the real manifest each time. Every
# nightly therefore accumulates from the last real release, which is what makes
# its notes a faithful preview of the upcoming release rather than a nightly
# changelog stream of its own.
#
# One name comes out of all this: vX.Y.Z-beta. The tag moves onto tonight's
# release commit, the images are pushed under it, and the single pre-release
# that lives on it is rewritten. Nothing is dated. A dated tag is a second
# name to keep in step with the release, and a tag per night is a tag list
# nobody reads.
#
# Usage:
#   task nightly:version                 # print the beta version
#   task nightly:channel                 # build the channel commit locally
#   task nightly:channel PUSH_CHANNEL=true
#   task nightly:release-head            # print the open release PR's head, if rebuilt tonight
#   task nightly:validate-inputs         # guard a run's ref
#   task nightly:test                    # exercise those guards

version: '3'

vars:
  # Branch that carries the nightly channel. Force-recreated on every run.
  NIGHTLY_BRANCH: '{{.NIGHTLY_BRANCH | default "nightly"}}'
  # The one branch a nightly may be cut from.
  RELEASE_REF: '{{.RELEASE_REF | default "main"}}'
  # VERSION is the next development version, i.e. exactly the minor
  # release-please is heading for on this line. A nightly is that minor's
  # rolling preview, so this is the only version a nightly publishes under.
  BETA_VERSION: '{{.VERSION}}-beta'
  BETA_TAG: 'v{{.BETA_VERSION}}'
  # release-please's own labels. It puts PENDING_LABEL on the release PR when
  # it opens it, finds its open PR again by that label, and refuses to touch
  # any release PR while a merged one still carries it. TAGGED_LABEL is what
  # clears a merged one.
  PENDING_LABEL: 'autorelease: pending'
  TAGGED_LABEL: 'autorelease: tagged'
  NIGHTLY_CONFIG: release-please-config-nightly.json
  NIGHTLY_MANIFEST: .release-please-manifest-nightly.json
  RELEASE_CONFIG: release-please-config.json
  RELEASE_MANIFEST: .release-please-manifest.json
  PUSH_CHANNEL: '{{.PUSH_CHANNEL | default "false"}}'
  # Per-invocation identity, never written to the user's or the runner's
  # global git config.
  COMMIT_NAME: '{{.COMMIT_NAME | default "github-actions[bot]"}}'
  COMMIT_EMAIL: '{{.COMMIT_EMAIL | default "41898282+github-actions[bot]@users.noreply.github.com"}}'

tasks:
  version:
    desc: "Print the nightly version: the minor under development, as a beta"
    silent: true
    env:
      BETA_VERSION_VALUE: '{{.BETA_VERSION}}'
    cmd: printf '%s\n' "${BETA_VERSION_VALUE}"

  beta-tag:
    desc: "Print the rolling tag for the release this line is heading for"
    silent: true
    # The one tag a nightly publishes: vX.Y.Z-beta, moved every night onto
    # whatever was built last. Someone who wants "the current 2.16.0 preview"
    # pulls this and gets last night's build without having to know a date.
    #
    # beta rather than dev: the tag is an invitation to try the next release,
    # and dev reads as "internal, you are holding it wrong". It also leaves
    # "nightly" to mean one thing — the channel — instead of two.
    env:
      BETA_TAG_VALUE: '{{.BETA_TAG}}'
    cmd: printf '%s\n' "${BETA_TAG_VALUE}"

  channel:
    desc: "Materialize tonight's release-please channel (PUSH_CHANNEL=true to publish the branch)"
    preconditions:
      - sh: command -v git >/dev/null 2>&1
        msg: "git is required"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required"
      - sh: test -f '{{.RELEASE_CONFIG}}'
        msg: "release-please config not found: {{.RELEASE_CONFIG}}"
      - sh: test -f '{{.RELEASE_MANIFEST}}'
        msg: "release-please manifest not found: {{.RELEASE_MANIFEST}}"
    cmds:
      - task: _derive-config
      - task: _commit-channel
      - task: _push-channel

  release-head:
    desc: "Print the head commit of the open nightly release PR if release-please rebuilt it tonight (empty otherwise)"
    silent: true
    # The release PR is never merged. release-please keeps one PR open on the
    # channel and, with always-update, resets its branch onto tonight's channel
    # tip and commits the CHANGELOG and manifest on top. That commit is what
    # the beta tag follows: the notes engine reads CHANGELOG.md at the tag, and
    # only the release commit carries the beta heading.
    #
    # stdout is the sha and nothing else; the caller captures it.
    preconditions:
      - sh: test -n "${GH_TOKEN:-}"
        msg: "GH_TOKEN is required"
      - sh: test -n "${GITHUB_REPOSITORY:-}"
        msg: "GITHUB_REPOSITORY is required"
      - sh: command -v gh >/dev/null 2>&1
        msg: "gh is required"
    cmds:
      - |
        # A merged release PR still labelled pending makes release-please
        # abort every night after with "There are untagged, merged release PRs
        # outstanding". Nothing here merges it, so a hand did.
        merged=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged \
          --base '{{.NIGHTLY_BRANCH}}' --label '{{.PENDING_LABEL}}' \
          --limit 1 --json number --jq '.[0].number // empty')
        if [ -n "${merged}" ]; then
          printf '::error::release PR #%s was merged into %s. The nightly release PR must stay open; while a merged one is labelled "%s", release-please will not update or open one. Relabel #%s "%s" and run the nightly again.\n' \
            "${merged}" '{{.NIGHTLY_BRANCH}}' '{{.PENDING_LABEL}}' "${merged}" '{{.TAGGED_LABEL}}' >&2
          exit 1
        fi

        # release-please names its branch after the target branch.
        pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
          --base '{{.NIGHTLY_BRANCH}}' \
          --head 'release-please--branches--{{.NIGHTLY_BRANCH}}' \
          --json number,headRefOid,labels \
          --jq '.[0] // empty | "\(.number) \(.headRefOid) \(any(.labels[]; .name == "{{.PENDING_LABEL}}"))"')
        if [ -z "${pr}" ]; then
          # Right after a real release there is nothing new to cut yet.
          echo "::notice::No release PR on {{.NIGHTLY_BRANCH}}; nothing has landed since the last release" >&2
          exit 0
        fi
        set -- ${pr}
        number=$1
        head=$2
        if [ "$3" != "true" ]; then
          # release-please only finds its open PR by this label. Without it
          # the next night opens a second PR instead of updating this one.
          printf '::error::release PR #%s has lost the "%s" label; put it back so release-please keeps updating this PR\n' \
            "${number}" '{{.PENDING_LABEL}}' >&2
          exit 1
        fi

        # An empty night leaves the PR where it was, on a channel tip that was
        # force-pushed away. Its head is last night's build, so tagging it
        # again would publish nothing new under tonight's name.
        channel=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/{{.NIGHTLY_BRANCH}}" --jq .object.sha)
        parent=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}" --jq '.parents | map(.sha) | join(" ")')
        if [ -z "${channel}" ] || [ "${parent}" != "${channel}" ]; then
          printf '::notice::release PR #%s was not rebuilt on tonight'"'"'s %s tip; nothing to publish tonight\n' \
            "${number}" '{{.NIGHTLY_BRANCH}}' >&2
          exit 0
        fi
        echo "release PR #${number} is at ${head}" >&2
        printf '%s\n' "${head}"

  publish-tags:
    desc: "Move the rolling beta tag onto tonight's release commit (RELEASE_SHA)"
    silent: true
    # Refs API, not git: the calling job has a depth-1 checkout of the release
    # line, so the release PR's head commit is not in its object store.
    requires:
      vars: [RELEASE_SHA]
    env:
      RELEASE_SHA_VALUE: '{{.RELEASE_SHA}}'
      BETA_TAG_VALUE: '{{.BETA_TAG}}'
    preconditions:
      - sh: test -n "${GH_TOKEN:-}"
        msg: "GH_TOKEN is required"
      - sh: test -n "${GITHUB_REPOSITORY:-}"
        msg: "GITHUB_REPOSITORY is required"
    cmds:
      - task: _sha-rule
        vars:
          SHA: '{{.RELEASE_SHA}}'
      - |
        sha="${RELEASE_SHA_VALUE}"

        # The exit status decides whether the tag is there, never the output:
        # gh prints the API's error body on stdout, so a 404 leaves a
        # perfectly non-empty value behind, and an absent tag reads as an
        # existing one at a sha of {"message":"Not Found",...}.
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${BETA_TAG_VALUE}" --jq .ref >/dev/null 2>&1; then
          # force, because the new commit is not a descendant of the old one:
          # every night's channel is branched fresh from the release line.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${BETA_TAG_VALUE}" \
            -f "sha=${sha}" -F force=true --jq .ref >/dev/null
          echo "moved ${BETA_TAG_VALUE} to ${sha}" >&2
        else
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${BETA_TAG_VALUE}" -f "sha=${sha}" --jq .ref >/dev/null
          echo "created ${BETA_TAG_VALUE}" >&2
        fi

  upsert-beta-release:
    desc: "Create the rolling beta pre-release if it is missing, and re-assert that it is a pre-release"
    silent: true
    # The prerelease flag is re-asserted and checked every night. Lose it and
    # the beta becomes "Latest release", and release-please's latest-release
    # lookup starts counting it.
    env:
      BETA_TAG_VALUE: '{{.BETA_TAG}}'
      BETA_VERSION_VALUE: '{{.BETA_VERSION}}'
    preconditions:
      - sh: test -n "${GH_TOKEN:-}"
        msg: "GH_TOKEN is required"
      - sh: test -n "${GITHUB_REPOSITORY:-}"
        msg: "GITHUB_REPOSITORY is required"
    cmds:
      - |
        if ! gh release view "${BETA_TAG_VALUE}" --repo "${GITHUB_REPOSITORY}" --json tagName >/dev/null 2>&1; then
          gh release create "${BETA_TAG_VALUE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${BETA_VERSION_VALUE}" \
            --prerelease \
            --notes "Preparing tonight's preview." >/dev/null
          echo "created pre-release ${BETA_TAG_VALUE}" >&2
        fi
        gh release edit "${BETA_TAG_VALUE}" \
          --repo "${GITHUB_REPOSITORY}" \
          --prerelease --latest=false >/dev/null
        state=$(gh release view "${BETA_TAG_VALUE}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)
        if [ "${state}" != "true" ]; then
          printf '::error::%s is not marked as a pre-release\n' "${BETA_TAG_VALUE}" >&2
          exit 1
        fi

  beta-header:
    desc: "Prepend tonight's header block to the rolling pre-release body"
    silent: true
    # After the notes engine, never before: the engine replaces the whole body,
    # so a header written first is silently gone. Markers keep re-runs idempotent.
    #
    # RELEASE_SHA is what ties the body to a build. The tag cannot: it is moved
    # every night, so naming it here would only say "the current one".
    requires:
      vars: [RELEASE_SHA]
    env:
      RELEASE_SHA_VALUE: '{{.RELEASE_SHA}}'
      BETA_TAG_VALUE: '{{.BETA_TAG}}'
      VERSION_VALUE: '{{.VERSION}}'
      REGISTRY_VALUE: '{{.REGISTRY_ADDRESS}}/{{.REGISTRY_PROJECT}}'
      E2E_RESULT_VALUE: '{{.E2E_RESULT | default ""}}'
      E2E_PASSED_VALUE: '{{.E2E_PASSED | default ""}}'
      E2E_TOTAL_VALUE: '{{.E2E_TOTAL | default ""}}'
      RUN_URL_VALUE: '{{.RUN_URL | default ""}}'
    preconditions:
      - sh: test -n "${GH_TOKEN:-}"
        msg: "GH_TOKEN is required"
      - sh: test -n "${GITHUB_REPOSITORY:-}"
        msg: "GITHUB_REPOSITORY is required"
    cmds:
      - |
        work=$(mktemp -d)
        trap 'rm -rf "${work}"' EXIT

        # tr -d '\r': one web-UI edit rewrites the body as CRLF, and then the
        # marker match silently stops finding anything.
        gh release view "${BETA_TAG_VALUE}" --repo "${GITHUB_REPOSITORY}" \
          --json body --jq .body | tr -d '\r' > "${work}/current.md"

        awk '
          /^<!-- beta-header:start -->$/ { skip = 1 }
          /^<!-- beta-header:end -->$/   { skip = 0; next }
          !skip
        ' "${work}/current.md" > "${work}/body.md"

        # No count means no report was written, which is not zero.
        if [ -n "${E2E_PASSED_VALUE}" ] && [ -n "${E2E_TOTAL_VALUE}" ]; then
          e2e="${E2E_RESULT_VALUE:-unknown} (${E2E_PASSED_VALUE}/${E2E_TOTAL_VALUE} scenarios passed)"
        elif [ -n "${E2E_RESULT_VALUE}" ]; then
          e2e="${E2E_RESULT_VALUE} (no scenario report produced)"
        else
          e2e="not reported"
        fi

        # cut rather than a printf precision: Task runs these commands under
        # mvdan/sh, where printf '%.7s' is not implemented.
        short=$(printf '%s' "${RELEASE_SHA_VALUE}" | cut -c1-7)

        {
          printf '<!-- beta-header:start -->\n'
          printf '> **Rolling preview of %s.** Rebuilt every night from `main`. Not feature-frozen, and not a release.\n' "${VERSION_VALUE}"
          printf '>\n'
          printf '> Currently built from [`%s`](../../commit/%s).\n' "${short}" "${RELEASE_SHA_VALUE}"
          printf '> End-to-end suite: **%s**.' "${e2e}"
          if [ -n "${RUN_URL_VALUE}" ]; then
            printf ' [Run](%s).' "${RUN_URL_VALUE}"
          fi
          printf '\n>\n'
          printf '> `%s` is the only tag a nightly publishes, and it moves. It changes under anyone who already pulled it, and for roughly an hour each night it points at a commit whose images are still building. Where a build has to stay put, resolve the digest once and pin that:\n' "${BETA_TAG_VALUE}"
          printf '>\n'
          printf '> ```sh\n'
          printf '> skopeo inspect docker://%s/harbor-core:%s | jq -r .Digest\n' "${REGISTRY_VALUE}" "${BETA_TAG_VALUE}"
          printf '> docker pull %s/harbor-core@sha256:...\n' "${REGISTRY_VALUE}"
          printf '> ```\n'
          printf '<!-- beta-header:end -->\n'
          printf '\n'
          cat "${work}/body.md"
        } > "${work}/notes.md"

        gh release edit "${BETA_TAG_VALUE}" --repo "${GITHUB_REPOSITORY}" \
          --notes-file "${work}/notes.md" >/dev/null
        echo "updated the header on ${BETA_TAG_VALUE}" >&2

  validate-inputs:
    desc: "Guard a nightly run's inputs before anything is published"
    silent: true
    # The workflow's first step, and the reason a nightly cannot be aimed
    # somewhere else: a dispatch from another ref would publish that ref's
    # VERSION and release configuration under the official nightly tag and
    # image names. A nightly takes no other input, so the ref is the whole
    # guard.
    cmds:
      - task: _validate-ref

  test:
    desc: "Exercise the nightly input guards"
    silent: true
    cmds:
      - |
        failures=0

        ok() { printf 'ok    %s\n' "$1"; }
        bad() { printf 'FAIL  %s\n' "$1" >&2; failures=$((failures + 1)); }

        # Every case starts from a clean slate and sets only what it is
        # testing, so a ref exported in the caller's shell cannot make a
        # rejection look like an acceptance.
        guard() { env -u GITHUB_REF_NAME "$@" task nightly:validate-inputs 2>&1; }

        accepts() {
          label=$1
          shift
          if out=$(guard "$@"); then ok "${label}"; else bad "${label}: expected accept, got: ${out}"; fi
        }
        rejects() {
          label=$1
          shift
          if out=$(guard "$@"); then bad "${label}: expected reject, was accepted"; else ok "${label}"; fi
        }

        accepts 'ref main'                  GITHUB_REF_NAME='{{.RELEASE_REF}}'

        rejects 'ref release-2.15'          GITHUB_REF_NAME=release-2.15
        rejects 'ref topic branch'          GITHUB_REF_NAME=nightly-release-channel
        rejects 'ref channel branch'        GITHUB_REF_NAME='{{.NIGHTLY_BRANCH}}'
        rejects 'ref empty'                 GITHUB_REF_NAME=
        rejects 'ref unset'                 IGNORED=1

        # -o interleaved for the same reason the workflow uses it: the root
        # Taskfile prefixes output per task, and the prefix would land inside
        # the captured version string.
        if out=$(task -o interleaved nightly:version 2>&1) && [ "${out}" = '{{.VERSION}}-beta' ]; then
          ok 'version is the minor under development, as a beta'
        else
          bad "version: got: ${out}"
        fi

        # The one tag a nightly publishes. It is the version with a v, and it
        # never carries a date — a date here would put a second name back on
        # every night's build.
        if out=$(task -o interleaved nightly:beta-tag 2>&1) && [ "${out}" = 'v{{.VERSION}}-beta' ]; then
          ok 'beta tag names the minor under development'
        else
          bad "beta tag: got: ${out}"
        fi
        case "$(task -o interleaved nightly:beta-tag 2>&1)" in
          *-beta.* | *[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) bad 'beta tag carries a date' ;;
          *) ok 'beta tag carries no date' ;;
        esac

        # publish-tags reaches an API path with the sha, so it is guarded the
        # same way the ref and the tag are.
        sha_guard() {
          env GH_TOKEN=x GITHUB_REPOSITORY=o/r \
            task nightly:publish-tags RELEASE_SHA="$1" 2>&1
        }
        for bad_sha in '' 'deadbeef' 'zzzz5f1e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8' '$(id)' \
          '0123456789abcdef0123456789abcdef0123456789abcdef'; do
          if out=$(sha_guard "${bad_sha}"); then
            bad "publish-tags accepted '${bad_sha}'"
          else
            ok "publish-tags rejected: '${bad_sha}'"
          fi
        done

        # The tag path. gh is stubbed because what is under test is how its
        # exit status is read: on a missing tag gh prints the API's error body
        # on stdout, so a check that reads the output sees a tag that is not
        # there, at a sha of {"message":"Not Found",...}.
        stub_dir=$(mktemp -d)
        trap 'rm -rf "${stub_dir}"' EXIT
        # Written through sed because a YAML block scalar owns the leading
        # whitespace: the heredoc body has to stay indented with the rest of
        # the script, and a shell script may not start with spaces.
        sed 's/^ *//' > "${stub_dir}/gh" <<'STUB'
        #!/bin/sh
        printf '%s\n' "$*" >> "${GH_STUB_LOG}"
        case "$*" in
          *"--state open"*)
            printf '%s\n' "${GH_STUB_OPEN_PR}"
            exit 0
            ;;
          *"--state merged"*)
            printf '%s\n' "${GH_STUB_PENDING_PR}"
            exit 0
            ;;
          *"--method POST"* | *"--method PATCH"*)
            printf 'refs/tags/stub\n'
            exit 0
            ;;
          *git/ref/heads/*)
            printf '%s\n' "${GH_STUB_CHANNEL_SHA}"
            exit 0
            ;;
          *"/commits/"*)
            printf '%s\n' "${GH_STUB_PARENTS}"
            exit 0
            ;;
          *"git/ref/tags/${GH_STUB_TAG} "*)
            if [ -n "${GH_STUB_SHA}" ]; then
              printf '%s\n' "${GH_STUB_SHA}"
              exit 0
            fi
            printf '{"message":"Not Found","status":"404"}\n'
            exit 1
            ;;
          *git/ref/tags/*)
            printf '{"message":"Not Found","status":"404"}\n'
            exit 1
            ;;
        esac
        exit 0
        STUB
        chmod 700 "${stub_dir}/gh"

        beta_tag='v{{.VERSION}}-beta'
        release_sha=0123456789abcdef0123456789abcdef01234567
        other_sha=fedcba9876543210fedcba9876543210fedcba98

        # $1 is the log to record gh's arguments in, $2 the sha the beta tag
        # already resolves to, empty for a tag that is not there yet.
        publish() {
          env PATH="${stub_dir}:${PATH}" GH_TOKEN=stub GITHUB_REPOSITORY=o/r \
            GH_STUB_LOG="$1" GH_STUB_TAG="${beta_tag}" GH_STUB_SHA="$2" \
            task nightly:publish-tags RELEASE_SHA="${release_sha}" 2>&1
        }

        log="${stub_dir}/missing.log"
        : > "${log}"
        if out=$(publish "${log}" ""); then
          if grep -qF "ref=refs/tags/${beta_tag} " "${log}"; then
            ok 'publish-tags creates the beta tag on the first night'
          else
            bad "publish-tags did not create the missing beta tag: $(cat "${log}")"
          fi
        else
          bad "publish-tags failed on a missing beta tag: ${out}"
        fi

        # The 404-on-stdout trap: gh prints the API's error body on stdout, so
        # a check that reads the output instead of the exit status would take
        # a missing tag for an existing one and try to move it.
        if grep -qF -- '--method PATCH' "${stub_dir}/missing.log"; then
          bad 'publish-tags tried to move a tag that was not there'
        else
          ok 'publish-tags reads gh exit status, not its stdout'
        fi

        log="${stub_dir}/move.log"
        : > "${log}"
        if out=$(publish "${log}" "${other_sha}"); then
          if grep -qF "git/refs/tags/${beta_tag} -f sha=${release_sha}" "${log}"; then
            ok 'publish-tags moves an existing beta tag onto tonight'
          else
            bad "publish-tags did not move the beta tag: $(cat "${log}")"
          fi
        else
          bad "publish-tags failed on an existing beta tag: ${out}"
        fi
        if grep -qF -- '--method POST' "${stub_dir}/move.log"; then
          bad 'publish-tags recreated a tag that already existed'
        else
          ok 'publish-tags moves rather than recreates'
        fi

        # The one open release PR. Its head is published only when it sits
        # directly on tonight's channel tip, and a merged one has to be loud.
        channel_sha=89abcdef0123456789abcdef0123456789abcdef
        release_head() {
          env PATH="${stub_dir}:${PATH}" GH_TOKEN=stub GITHUB_REPOSITORY=o/r \
            GH_STUB_LOG="${stub_dir}/head.log" GH_STUB_OPEN_PR="$1" GH_STUB_PENDING_PR="$2" \
            GH_STUB_CHANNEL_SHA="${channel_sha}" GH_STUB_PARENTS="$3" \
            task -o interleaved nightly:release-head
        }

        if out=$(release_head "1076 ${release_sha} true" "" "${channel_sha}" 2>/dev/null) \
          && [ "${out}" = "${release_sha}" ]; then
          ok 'release-head prints the head of a PR rebuilt tonight'
        else
          bad "release-head on a rebuilt PR: got: ${out}"
        fi

        if out=$(release_head "1076 ${release_sha} true" "" "${other_sha}" 2>&1); then
          case "${out}" in
            *"${release_sha}"*) bad 'release-head published a PR left on last night'"'"'s channel' ;;
            *'was not rebuilt'*) ok 'an empty night does not retag a stale release PR' ;;
            *) bad "a stale release PR ended green for the wrong reason: ${out}" ;;
          esac
        else
          bad "a stale release PR failed: ${out}"
        fi

        if out=$(release_head "" "" "" 2>&1); then
          case "${out}" in
            *'nothing has landed since the last release'*) ok 'a night with no release PR ends green' ;;
            *) bad "a night with no release PR ended green for the wrong reason: ${out}" ;;
          esac
        else
          bad "a night with no release PR failed: ${out}"
        fi

        if out=$(release_head "1076 ${release_sha} true" 1069 "${channel_sha}" 2>&1); then
          bad "a merged release PR still labelled pending ended green: ${out}"
        else
          case "${out}" in
            *'#1069 was merged into nightly'*) ok 'a merged release PR fails loudly' ;;
            *) bad "a merged release PR failed for the wrong reason: ${out}" ;;
          esac
        fi

        if out=$(release_head "1076 ${release_sha} false" "" "${channel_sha}" 2>&1); then
          bad "a release PR without the pending label ended green: ${out}"
        else
          case "${out}" in
            *'lost the'*) ok 'a release PR without the pending label fails' ;;
            *) bad "a release PR without the pending label failed for the wrong reason: ${out}" ;;
          esac
        fi

        # The published-tag guard, which the e2e workflow runs before a tag
        # reaches an image reference.
        tag_guard() { task nightly:validate-tag TAG="$1" 2>&1; }
        for good in v2.16.0 v2.16.0-beta v2.16.0-beta.20260922 v2.16.0-nightly-20260922 v10.0.1; do
          if out=$(tag_guard "${good}"); then ok "tag ${good}"; else bad "tag ${good}: rejected: ${out}"; fi
        done
        for nope in v2.16 2.16.0 v1.2.3.4 v2.16.0-rc1 'v2.16.0; id' 'v2.16.0-beta.2026' 'v2.16.0-beta.' "$(printf 'x\nv2.16.0')" ''; do
          out=$(tag_guard "${nope}" || true)
          case "${out}" in
            *uid=*) bad "tag '${nope}': id executed" ;;
            *) if task nightly:validate-tag TAG="${nope}" >/dev/null 2>&1; then bad "tag '${nope}': accepted"; else ok "tag rejected: '${nope}'"; fi ;;
          esac
        done

        if [ "${failures}" -ne 0 ]; then
          printf '\n%s nightly guard test(s) failed\n' "${failures}" >&2
          exit 1
        fi
        printf '\nnightly guard tests passed\n'

  validate-tag:
    desc: "Guard a published release tag before it reaches an image reference (TAG)"
    silent: true
    # Used by the e2e workflow for both channels. It lives here rather than
    # with the suite because it has to run before the megamerge that brings
    # the suite in — and because a tag from a caller reaches both an image
    # reference and a Task command line.
    requires:
      vars: [TAG]
    # TAG_VALUE rather than TAG: a task's env does not override a variable
    # already in the process environment, and the calling workflow exports
    # TAG.
    env:
      TAG_VALUE: '{{.TAG}}'
    cmd: |
      TAG="${TAG_VALUE}"
      # Globs, not regexes: grep and [[ =~ ]] match a line at a time, so a
      # value carrying a newline next to a tag would pass either.
      case "${TAG}" in
        v[0-9]*.[0-9]*.[0-9]*) ;;
        *)
          printf '::error::not a release tag: %s\n' "${TAG}" >&2
          exit 1
          ;;
      esac
      rest="${TAG#v}"
      # Exactly three numeric components, optionally followed by a prerelease.
      version="${rest%%-*}"
      suffix=""
      if [ "${version}" != "${rest}" ]; then
        suffix="${rest#*-}"
      fi
      case "${version}" in
        *[!0-9.]* | *..* | .* | *. | "")
          printf '::error::not a release tag: %s\n' "${TAG}" >&2
          exit 1
          ;;
      esac
      case "${version}" in
        *.*.*.* | *.*.*) ;;
        *)
          printf '::error::not a release tag: %s\n' "${TAG}" >&2
          exit 1
          ;;
      esac
      case "${version}" in
        *.*.*.*)
          printf '::error::not a release tag: %s\n' "${TAG}" >&2
          exit 1
          ;;
      esac
      # The only prerelease this project publishes.
      case "${suffix}" in
        "" | beta) ;;
        # Dated nightlies, from before the channel settled on one moving tag.
        # They are kept, so the e2e suite has to keep being able to name them.
        beta.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
        nightly-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
        *)
          printf '::error::not a release tag: %s\n' "${TAG}" >&2
          exit 1
          ;;
      esac

  _validate-ref:
    internal: true
    silent: true
    env:
      GITHUB_REF_NAME: '{{.GITHUB_REF_NAME}}'
      RELEASE_REF: '{{.RELEASE_REF}}'
    cmd: |
      ref="${GITHUB_REF_NAME:-}"
      if [ "${ref}" != "${RELEASE_REF}" ]; then
        # ::error:: is picked up by the workflow log, and is harmless locally.
        printf '::error::Nightlies are cut from %s only. Current ref: %s\n' \
          "${RELEASE_REF}" "${ref:-<unset>}" >&2
        exit 1
      fi

  _sha-rule:
    internal: true
    silent: true
    # A release sha reaches an API path, so there is one place that says what
    # one may contain. SHA_VALUE rather than SHA: a task's env does
    # not override a variable already in the process environment, and the
    # workflow exports RELEASE_SHA.
    env:
      SHA_VALUE: '{{.SHA}}'
    cmd: |
      sha="${SHA_VALUE}"
      case "${sha}" in
        *[!0-9a-f]* | "")
          printf '::error::not a commit sha: %s\n' "${sha}" >&2
          exit 1
          ;;
      esac
      case "${#sha}" in
        40) ;;
        *)
          printf '::error::not a full commit sha: %s\n' "${sha}" >&2
          exit 1
          ;;
      esac

  _derive-config:
    internal: true
    env:
      BETA_VERSION: '{{.BETA_VERSION}}'
    cmds:
      # Derived from the real config instead of duplicated: the nightly notes
      # have to accumulate exactly what the real release will, which means the
      # same exclude-paths and the same changelog-sections, forever.
      #
      # release-as is the beta version, not the dated one: the notes engine
      # looks for a CHANGELOG heading named after the tag it renders, so the
      # two must match. Only release-as can hold a name still.
      - >-
        jq --arg version "${BETA_VERSION}"
        '.packages["."] += {"release-as": $version, "prerelease": true}'
        '{{.RELEASE_CONFIG}}' > '{{.NIGHTLY_CONFIG}}'
      # Seeded from the real manifest, so the channel starts at the last
      # published release and every nightly renders the full upcoming release.
      - cp '{{.RELEASE_MANIFEST}}' '{{.NIGHTLY_MANIFEST}}'

  _commit-channel:
    internal: true
    env:
      BETA_VERSION_VALUE: '{{.BETA_VERSION}}'
    cmds:
      - git switch --force-create '{{.NIGHTLY_BRANCH}}'
      - git add '{{.NIGHTLY_CONFIG}}' '{{.NIGHTLY_MANIFEST}}'
      - >-
        git -c user.name='{{.COMMIT_NAME}}' -c user.email='{{.COMMIT_EMAIL}}'
        commit -s -m "chore: Open the ${BETA_VERSION_VALUE} nightly channel"

  _push-channel:
    internal: true
    status:
      - test '{{.PUSH_CHANNEL}}' != "true"
    cmds:
      # Force: last night's channel and its release commit are replaced.
      # Nothing keeps the old release commit reachable once the beta tag moves
      # off it, and nothing needs to: it carried no content of its own beyond
      # the channel manifest, and every commit it released is on main.
      - git push --force origin 'HEAD:refs/heads/{{.NIGHTLY_BRANCH}}'
