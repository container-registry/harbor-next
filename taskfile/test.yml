# Testing and Quality Assurance Tasks
# Linting, vulnerability scanning, and tests

version: '3'

includes:
  build:
    taskfile: ./build.yml
    dir: ..
    internal: true

vars:
  GO_TEST_UPSTREAM_REPO: '{{.GO_TEST_UPSTREAM_REPO | default "https://github.com/container-registry/harbor-next.git"}}'
  GO_TEST_UPSTREAM_REF: '{{.GO_TEST_UPSTREAM_REF | default "main"}}'
  GO_TEST_TMP_ROOT: '{{.GO_TEST_TMP_ROOT | default "tmp"}}'
  GO_TEST_TMP_CLONE: '{{.GO_TEST_TMP_CLONE | default (printf "%s/harbor-next-go-tests" .GO_TEST_TMP_ROOT)}}'
  # Packages we still exclude from CI by default because they need external
  # services or a full Harbor stack we do not provision in unit-test jobs.
  DEFAULT_DB_EXCLUDE: '/controller/ldap$|/core/auth/ldap$|/pkg/ldap$|/core/api$|/core/controllers$|/server/middleware/security$|/controller/systeminfo$|/common/utils/email$|/jobservice/runner$|/jobservice/logger/getter$|/jobservice/logger/backend$|/jobservice/logger/sweeper$|/controller/usergroup/test$|/pkg/exporter$|/pkg/scan/dao/scan$|/pkg/scan/postprocessors$|/pkg/systemartifact$|/pkg/federatedidp/dao$'
  # Packages excluded from the pure lane because they require Redis/Postgres
  # setup, have db-tagged tests that should only run in the DB lane, or are
  # timing-sensitive under shared CI runners.
  DEFAULT_PURE_EXCLUDE: '/controller/ldap$|/core/auth/ldap$|/pkg/ldap$|/core/api$|/core/controllers$|/server/middleware/security$|/controller/systeminfo$|/common/utils/email$|/jobservice/runner$|/jobservice/logger/getter$|/jobservice/logger/backend$|/jobservice/logger/sweeper$|/controller/usergroup/test$|/pkg/exporter$|/pkg/scan/dao/scan$|/pkg/scan/postprocessors$|/pkg/systemartifact$|/core/session$|/jobservice/job/impl/gc$|/lib/cache/redis$|/pkg/jobmonitor$|/pkg/proxy/connection$|/pkg/proxy/secret$|/pkg/scan/dao/scanner$|/pkg/scan/export$|/server/middleware/blob$|/pkg/federatedidp/dao$'
  # These packages need Redis/Postgres-backed test setup but do not use
  # //go:build db test files, so we add them explicitly to the DB lane.
  DEFAULT_DB_EXTRA_PACKAGES: 'github.com/goharbor/harbor/src/core/session github.com/goharbor/harbor/src/jobservice/job/impl/gc github.com/goharbor/harbor/src/lib/cache/redis github.com/goharbor/harbor/src/pkg/jobmonitor github.com/goharbor/harbor/src/pkg/proxy/connection'

tasks:
  # ============================================================================
  # Linting Tasks
  # ============================================================================

  _golangci-lint:
    internal: true
    deps: [build:gen-apis]
    cmd: >-
      docker run --rm
      -v $(pwd):/harbor -w /harbor/src
      golangci/golangci-lint:{{.GOLANGCILINT_VERSION}}-alpine
      golangci-lint -v run --timeout=10m {{.LINT_ARGS}}

  _require-golangci-lint:
    internal: true
    run: once
    status:
      - test -x {{.GOPATH_BIN}}/golangci-lint
      - |
        version='{{.GOLANGCILINT_VERSION}}'
        {{.GOPATH_BIN}}/golangci-lint version | grep -Eq "version v?${version#v}"
      - |
        target_go=$(awk '/^go / { split($2, v, "."); print v[1] * 1000 + v[2]; exit }' src/go.mod)
        lint_go=$({{.GOPATH_BIN}}/golangci-lint version | sed -n 's/.*built with go\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | awk -F. '{ print $1 * 1000 + $2 }')
        test "${lint_go}" -ge "${target_go}"
    cmd: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCILINT_VERSION}}

  lint:
    desc: "Lint Go code with golangci-lint in Docker"
    cmds:
      - task: _golangci-lint

  lint:local:
    desc: "Lint Go code with local golangci-lint"
    deps:
      - build:gen-apis
      - _require-golangci-lint
    dir: src
    cmd: "{{.GOPATH_BIN}}/golangci-lint -v run --timeout=10m {{.LINT_ARGS}}"

  lint:report:
    desc: "Lint Go code and write report to golangci-lint.report"
    cmds:
      - task: _golangci-lint
        vars: { LINT_ARGS: "--output.json.path /harbor/golangci-lint.report --issues-exit-code 0" }

  lint:api:
    desc: "Lint swagger.yaml with Spectral in Docker"
    sources:
      - "api/v2.0/swagger.yaml"
    cmd: >-
      docker run --rm
      -v $(pwd):/src -w /src
      stoplight/spectral:{{.SPECTRAL_VERSION}}
      lint ./api/v2.0/swagger.yaml

  # ============================================================================
  # Vulnerability Scanning
  # ============================================================================

  _require-govulncheck:
    internal: true
    run: once
    status:
      - test -x {{.GOPATH_BIN}}/govulncheck
    cmd: go install golang.org/x/vuln/cmd/govulncheck@latest

  vuln-check:
    desc: "Scan Go dependencies for known vulnerabilities"
    deps: [_require-govulncheck]
    dir: src
    cmd: "{{.GOPATH_BIN}}/govulncheck -show verbose ./..."

  vuln-report:
    desc: "Scan Go dependencies and write SARIF report to govulncheck.sarif"
    deps: [_require-govulncheck]
    dir: src
    cmd: "{{.GOPATH_BIN}}/govulncheck -format sarif ./... > ../govulncheck.sarif"

  # ============================================================================
  # Unit Tests
  # ============================================================================

  _prepare-go-tests:
    internal: true
    cmds:
      - task: build:gen-apis

  unit:coverage:
    desc: "Run pure unit tests and generate HTML coverage report"
    cmds:
      - task: unit:pure
        vars:
          RACE_FLAGS: "-race"
          COVER_FLAGS: "-coverprofile=coverage.out -covermode=atomic"
      - cmd: cd src && go tool cover -html=coverage.out -o coverage.html

  go:
    desc: "Apply EE patches and run normal Go unit tests (no E2E)"
    cmds:
      - task: unit:patched
        vars:
          TEST_FLAGS: '{{.TEST_FLAGS | default "-count=1"}}'
          PURE_PKG_EXCLUDE: '{{.PURE_PKG_EXCLUDE}}'

  unit:patched:
    desc: "Run pure Go unit tests from an applied EE patch workspace"
    vars:
      TEST_FLAGS: '{{.TEST_FLAGS | default "-count=1"}}'
    cmds:
      - task: _require-go-test-tools
      - mkdir -p "{{.GO_TEST_TMP_ROOT}}"
      - rm -rf "{{.GO_TEST_TMP_CLONE}}"
      - git clone --branch "{{.GO_TEST_UPSTREAM_REF}}" --depth 200 "{{.GO_TEST_UPSTREAM_REPO}}" "{{.GO_TEST_TMP_CLONE}}"
      - task: :patches:apply
        vars: { TARGET_DIR: '{{.GO_TEST_TMP_CLONE}}' }
      - mkdir -p "{{.GO_TEST_TMP_CLONE}}/taskfile" "{{.GO_TEST_TMP_CLONE}}/tools/ci"
      - task: _copy-go-test-harness
        vars:
          GO_TEST_TMP_CLONE: '{{.GO_TEST_TMP_CLONE}}'
      - task --dir "{{.GO_TEST_TMP_CLONE}}" test:unit:pure TEST_FLAGS="{{.TEST_FLAGS}}" PURE_PKG_EXCLUDE="{{.PURE_PKG_EXCLUDE | default .DEFAULT_PURE_EXCLUDE}}"

  _copy-go-test-harness:
    internal: true
    cmds:
      - cp Taskfile.yml "{{.GO_TEST_TMP_CLONE}}/Taskfile.yml"
      - cp taskfile/*.yml "{{.GO_TEST_TMP_CLONE}}/taskfile/"
      - cp tools/ci/list-go-test-packages.sh "{{.GO_TEST_TMP_CLONE}}/tools/ci/list-go-test-packages.sh"

  _require-go-test-tools:
    internal: true
    cmds:
      - |
        missing=""
        for tool in git go task; do
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "[error] missing required Go test tools:$missing" >&2
          exit 1
        fi

  # ----------------------------------------------------------------------------
  # CI-hostile packages excluded from the DB lane by default.
  # Each entry is here because:
  #   - LDAP packages (/controller/ldap, /core/auth/ldap, /pkg/ldap): need LDAP
  #     server we don't provision
  #   - /core/api, /core/controllers: need full Harbor stack
  #   - /server/middleware/security, /controller/systeminfo: need /etc/core/
  #     cert files
  #   - /common/utils/email: reaches external SMTP (smtp.gmail.com) from tests
  #   - /jobservice/runner: Redis job tracker state ordering issues
  #   - /jobservice/logger/getter: DB state ordering when packages run in parallel
  #   - /controller/usergroup/test, /pkg/scan/dao/scan,
  #     /pkg/scan/postprocessors, /pkg/systemartifact:
  #     upstream test-ordering / FK-constraint issues
  #
  # The DB filter is defined once as DEFAULT_DB_EXCLUDE at the top of this
  # file. The pure lane uses DEFAULT_PURE_EXCLUDE, which additionally routes
  # Redis/Postgres-backed packages into the DB lane.
  # To run every package in dev, pass a sentinel regex that matches nothing:
  #     task test:unit:pure PURE_PKG_EXCLUDE='^$'
  # (Passing an empty string does NOT work — slim-sprig `default` treats it as
  # unset, and `grep -vE ''` would drop every line anyway.)
  # ----------------------------------------------------------------------------
  unit:pure:
    desc: "Run pure unit tests (no DB/Redis needed) with full parallelism"
    cmds:
      - task: _prepare-go-tests
      - cmd: |
          cd src
          pkgs=$(../tools/ci/list-go-test-packages.sh pure '{{.PURE_PKG_EXCLUDE | default .DEFAULT_PURE_EXCLUDE}}' \
            | awk 'BEGIN { shard="{{.SHARD_INDEX | default ""}}"; total="{{.SHARD_TOTAL | default ""}}"; } total == "" || shard == "" || ((NR - 1) % total) == shard { print }' \
            | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "no pure test packages matched"
            exit 1
          fi
          # shellcheck disable=SC2086
          UTTEST=true go test {{.RACE_FLAGS | default ""}} -timeout=15m {{.COVER_FLAGS}} {{.TEST_FLAGS}} $pkgs

  unit:db:
    desc: "Run DB-dependent unit tests serially (needs PostgreSQL + Redis)"
    cmds:
      - task: _prepare-go-tests
      - cmd: |
          cd src
          pkgs=$(
            {
              ../tools/ci/list-go-test-packages.sh db-tagged '{{.DB_PKG_EXCLUDE | default .DEFAULT_DB_EXCLUDE}}'
              printf '%s\n' '{{.DB_EXTRA_PACKAGES | default .DEFAULT_DB_EXTRA_PACKAGES}}' | tr ' ' '\n'
            } \
            | awk 'NF' \
            | sort -u \
            | awk 'BEGIN { shard="{{.SHARD_INDEX | default ""}}"; total="{{.SHARD_TOTAL | default ""}}"; } total == "" || shard == "" || ((NR - 1) % total) == shard { print }' \
            | tr '\n' ' '
          )
          if [ -z "$pkgs" ]; then
            echo "no db-tagged test packages matched"
            exit 1
          fi
          # shellcheck disable=SC2086
          UTTEST=true go test {{.RACE_FLAGS | default ""}} -timeout=15m -tags db -p 1 -parallel 1 {{.COVER_FLAGS}} {{.TEST_FLAGS}} $pkgs

  unit:
    desc: "Alias for pure unit tests"
    cmds:
      - task: unit:pure
        vars:
          PURE_PKG_EXCLUDE: '{{.PURE_PKG_EXCLUDE}}'
          RACE_FLAGS: '{{.RACE_FLAGS}}'
          COVER_FLAGS: '{{.COVER_FLAGS}}'
          TEST_FLAGS: '{{.TEST_FLAGS}}'

  db:
    desc: "Alias for DB unit tests"
    cmds:
      - task: unit:db
        vars:
          DB_PKG_EXCLUDE: '{{.DB_PKG_EXCLUDE}}'
          DB_EXTRA_PACKAGES: '{{.DB_EXTRA_PACKAGES}}'
          RACE_FLAGS: '{{.RACE_FLAGS}}'
          COVER_FLAGS: '{{.COVER_FLAGS}}'
          TEST_FLAGS: '{{.TEST_FLAGS}}'

  unit:watch:
    desc: "Re-run Go unit tests on file changes (requires watchexec)"
    preconditions:
      - sh: command -v watchexec
        msg: "watchexec not found. Install: brew install watchexec"
    dir: src
    env:
      UTTEST: "true"
    cmd: watchexec -e go -r -- go test -v ./...

  # ============================================================================
  # End-to-End Tests (godog / Gherkin)
  # ============================================================================
  # `task e2e` and `task e2e:test` are the primary local entrypoints now. These
  # aliases keep the older `test:e2e*` surface working while delegating to the
  # new stack-owning flow.

  e2e:
    desc: "Compatibility alias for task e2e:test"
    vars:
      TAGS:        '{{.TAGS        | default ""}}'
      E2E_TIMEOUT: '{{.E2E_TIMEOUT | default "30m"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "4"}}'
    cmds:
      - task: :e2e:test
        vars: { TAGS: '{{.TAGS}}', E2E_TIMEOUT: '{{.E2E_TIMEOUT}}', CONCURRENCY: '{{.CONCURRENCY}}' }

  e2e:smoke:
    desc: "E2E @smoke scenarios only"
    cmds:
      - task: e2e
        vars: { TAGS: '@smoke' }

  e2e:tags:
    desc: "E2E with custom tag expression (TAGS='@registry && ~@wip')"
    cmds:
      - task: e2e
        vars: { TAGS: '{{.TAGS}}' }

  e2e:fedidp:
    desc: "E2E FedIDP API + offline JWT scenarios"
    vars:
      E2E_TIMEOUT: '{{.E2E_TIMEOUT | default "30m"}}'
      SKIP_TRIVY:  '{{.SKIP_TRIVY  | default "false"}}'
    cmds:
      - task: :e2e:test
        vars:
          TAGS: '@fedidp && ~@k8s'
          E2E_TIMEOUT: '{{.E2E_TIMEOUT}}'
          SKIP_TRIVY: '{{.SKIP_TRIVY}}'

  e2e:fedidp:k8s:
    desc: "E2E FedIDP K8s SA-token scenarios (requires a prepared KIND cluster)"
    vars:
      E2E_TIMEOUT: '{{.E2E_TIMEOUT | default "30m"}}'
      SKIP_TRIVY:  '{{.SKIP_TRIVY  | default "false"}}'
    cmds:
      - task: :e2e:test
        vars:
          TAGS: '@fedidp && @k8s'
          E2E_TIMEOUT: '{{.E2E_TIMEOUT}}'
          SKIP_TRIVY: '{{.SKIP_TRIVY}}'
          CONCURRENCY: '1'

  # ----------------------------------------------------------------------------
  # Deployed / remote target
  #
  # Runs the same godog suite against a Harbor instance that is NOT the local
  # dev stack — staging, a cluster, a hosted tenancy, etc. Takes URL and
  # credentials as task variables instead of assuming localhost.
  #
  # Usage:
  #   task test:e2e:deployed URL=https://harbor.example.com PASSWORD='…'
  #   task test:e2e:deployed URL=https://harbor.example.com USERNAME=svc PASSWORD='…' TAGS='@smoke'
  #
  # Variables:
  #   URL          required — Harbor base URL, e.g. https://harbor.example.com
  #   USERNAME     default admin
  #   PASSWORD     required — admin (or robot-like) password for the target
  #   TAGS         default '@smoke && ~@gc && ~@k8s' — safer default for shared/remote
  #                instances (@gc triggers a full garbage collection). Set
  #                explicitly to broaden or narrow.
  #   CONCURRENCY  default 1 — remote targets are often shared; parallel
  #                scenarios can hammer them. Raise cautiously.
  #   E2E_TIMEOUT  default 30m
  #
  # Credential note: passing PASSWORD on the command line lands it in your
  # shell history. Prefer exporting HARBOR_PASSWORD in the parent shell and
  # omitting PASSWORD from the task invocation — the task honours whichever
  # is set (PASSWORD taking precedence).
  #
  # Safety note: the suite creates real projects, users, robots, webhooks,
  # and policies under the admin account it authenticates as. Teardown is
  # best-effort. Do not point this at production without a dedicated test
  # admin account and a narrow tag expression.
  e2e:deployed:
    desc: "E2E against a deployed Harbor (URL=… USERNAME=… PASSWORD=…)"
    vars:
      URL:         '{{.URL}}'
      USERNAME:    '{{.USERNAME    | default "admin"}}'
      PASSWORD:    '{{.PASSWORD}}'
      TAGS:        '{{.TAGS        | default "@smoke && ~@gc && ~@k8s"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "1"}}'
      E2E_TIMEOUT: '{{.E2E_TIMEOUT | default "30m"}}'
    preconditions:
      - sh: '[ -n "{{.URL}}" ]'
        msg: |
          URL is required.
          Usage: task test:e2e:deployed URL=https://harbor.example.com PASSWORD='…'
      - sh: '[ -n "{{.PASSWORD}}" ] || [ -n "${HARBOR_PASSWORD:-}" ]'
        msg: |
          PASSWORD is required (or export HARBOR_PASSWORD before running).
          Usage: task test:e2e:deployed URL=https://harbor.example.com PASSWORD='…'
    cmds:
      - task: _e2e:deployed:preflight
        vars: { URL: '{{.URL}}' }
      - task: _e2e:deployed:run
        vars:
          URL:         '{{.URL}}'
          USERNAME:    '{{.USERNAME}}'
          PASSWORD:    '{{.PASSWORD}}'
          TAGS:        '{{.TAGS}}'
          CONCURRENCY: '{{.CONCURRENCY}}'
          E2E_TIMEOUT: '{{.E2E_TIMEOUT}}'

  _e2e:deployed:preflight:
    internal: true
    silent: true
    vars:
      BASE: '{{.URL | trimSuffix "/"}}'
    cmds:
      - |
        if ! curl -fsSk "{{.BASE}}/api/v2.0/health" > /dev/null 2>&1; then
          echo "[error] Harbor not responding at {{.BASE}}" >&2
          echo "[error] Check the URL, network, and that the target accepts basic auth." >&2
          exit 1
        fi
      - |
        missing=""
        command -v docker     >/dev/null 2>&1 || missing="$missing docker"
        command -v cosign     >/dev/null 2>&1 || missing="$missing cosign"
        docker buildx version >/dev/null 2>&1 || missing="$missing docker-buildx"
        if [ -n "$missing" ]; then
          echo "[error] missing required e2e tools:$missing" >&2
          exit 1
        fi

  _e2e:deployed:run:
    internal: true
    dir: src
    env:
      HARBOR_URL:      '{{.URL | trimSuffix "/"}}'
      HARBOR_USERNAME: '{{.USERNAME}}'
      # PASSWORD falls back to the caller's HARBOR_PASSWORD when the task var
      # is empty — lets you keep secrets out of shell history.
      HARBOR_PASSWORD: '{{if .PASSWORD}}{{.PASSWORD}}{{else}}{{env "HARBOR_PASSWORD"}}{{end}}'
    # Tag expression is single-quoted so `&&` / `~` in 'TAGS' aren't
    # interpreted by the shell before reaching godog.
    cmd: go test -v -tags e2e -timeout {{.E2E_TIMEOUT}} -run TestFeatures ./e2e/... -args {{if .TAGS}}-godog.tags='{{.TAGS}}'{{end}} -godog.concurrency={{.CONCURRENCY}}

  # ============================================================================
  # Mock Validation
  # ============================================================================

  check-mocks:
    desc: "Verify generated mock files match committed versions"
    cmds:
      - |
        res=$(git status -s src/ | awk '{ printf("%s\n", $2) }' | grep -E '\.go$' || true)
        if [ -n "$res" ]; then
          echo "Mock files are out of date:"
          echo "$res"
          exit 1
        fi

  _require-mockery:
    internal: true
    run: once
    status:
      - test -x {{.GOPATH_BIN}}/mockery
    cmd: go install github.com/vektra/mockery/v2@latest

  generate-mocks:
    desc: "Regenerate all mock files with mockery"
    deps: [_require-mockery]
    dir: src
    cmd: "{{.GOPATH_BIN}}/mockery --all --dir . --output ./testing/mocks"

  # ============================================================================
  # Frontend Tests
  # ============================================================================

  frontend:test:
    desc: "Run frontend tests once"
    dir: src/portal
    cmd: npm run test -- --watch=false

  frontend:test:watch:
    desc: "Run frontend tests in watch mode"
    dir: src/portal
    cmd: npm run test -- --watch

  frontend:lint:
    desc: "Lint frontend TypeScript code"
    dir: src/portal
    cmd: npm run lint

  frontend:lint:style:
    desc: "Lint frontend SCSS code"
    dir: src/portal
    cmd: npm run lint:style

  # ============================================================================
  # Aggregate Test Tasks
  # ============================================================================

  all:
    desc: "Run pure unit tests and DB tests"
    cmds:
      - task: unit:pure
      - task: unit:db

  ci:
    desc: "Run full CI pipeline with reports (lint, vuln scan, split unit tests)"
    deps:
      - _ci-checks
      - _ci-tests

  _ci-checks:
    internal: true
    deps:
      - lint:api
      - lint:report
      - vuln-report

  _ci-tests:
    internal: true
    cmds:
      - task: unit:pure
        vars:
          COVER_FLAGS: "-coverprofile=coverage-pure.out -covermode=atomic"
          TEST_FLAGS: "-count=1"
      - task: unit:db
        vars:
          COVER_FLAGS: "-coverprofile=coverage-db.out -covermode=atomic"
          TEST_FLAGS: "-count=1"
      - cmd: |
          cd src
          if [ -f coverage-pure.out ] && [ -f coverage-db.out ]; then
            { head -1 coverage-pure.out; tail -n +2 coverage-pure.out; tail -n +2 coverage-db.out; } > coverage.out
            rm -f coverage-pure.out coverage-db.out
          elif [ -f coverage-pure.out ]; then
            mv coverage-pure.out coverage.out
          elif [ -f coverage-db.out ]; then
            mv coverage-db.out coverage.out
          fi
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o coverage.html
          fi

  quick:
    desc: "Run API lint and unit tests only (fast validation)"
    cmds:
      - task: lint:api
      - task: unit:pure

  # ============================================================================
  # Utilities
  # ============================================================================

  clean:
    desc: "Remove lint reports, SARIF files, coverage output, and E2E artifacts"
    cmds:
      - rm -f golangci-lint.report
      - rm -f govulncheck.sarif
      - rm -f src/coverage.out src/coverage-pure.out src/coverage-db.out src/coverage.html
      - rm -rf reports/
