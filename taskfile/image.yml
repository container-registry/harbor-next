# Docker Image Building Tasks
#
# CI-aware: local builds native arch only, CI builds all platforms
# PUSH=false forces native arch (--load requires single platform)
# IMAGE_TAG defaults to VERSION; override to publish under a different tag
# (e.g. a feature-branch build) without touching the VERSION file.
#
# Usage:
#   task image:core                         # CI: multi-arch push, local: native push
#   task image:core PUSH=false              # load locally (native arch)
#   task image:core IMAGE_TAG=my-feature    # push under a custom tag
#   task image:all-images                   # all images

version: '3'

includes:
  build:
    taskfile: ./build.yml
    dir: ..
    internal: true

vars:
  PUSH: '{{.PUSH | default "true"}}'
  PLATFORMS: '{{.PLATFORMS | default (ternary (printf "linux/%s" ARCH) .CI_PLATFORMS (eq .PUSH "false"))}}'
  IMAGE_TAG: '{{.IMAGE_TAG | default (.TAG | default .VERSION)}}'

tasks:
  all-images:
    desc: "Build all container images"
    deps:
      - core
      - jobservice
      - registryctl
      - exporter
      - portal
      - registry
      - trivy-adapter

  # --- Buildx (Docker only) ---

  buildx:setup:
    internal: true
    run: once
    preconditions:
      - sh: '[ "{{.CONTAINER_ENGINE}}" = "docker" ]'
        msg: "buildx:setup requires Docker (detected: {{.CONTAINER_ENGINE}})"
    status:
      - docker buildx inspect {{.IMAGE_BUILDER}} >/dev/null 2>&1
    cmds:
      - docker buildx create --name {{.IMAGE_BUILDER}} --driver docker-container --bootstrap
      - docker buildx use {{.IMAGE_BUILDER}}

  buildx:remove:
    desc: "Remove the harbor-multiarch buildx builder instance"
    cmd: docker buildx rm {{.IMAGE_BUILDER}} 2>/dev/null || true

  buildx:list:
    desc: "List available buildx builders"
    cmd: docker buildx ls

  # --- Internal ---

  _build:
    internal: true
    label: 'image:{{.IMAGE_NAME}}'
    requires:
      vars: [IMAGE_NAME, DOCKERFILE]
    vars:
      OUTPUT: '{{ternary "--push" "--load" (eq .PUSH "true")}}'
      TAG_PREFIX: '{{ternary (printf "%s/%s/" .REGISTRY_ADDRESS .REGISTRY_PROJECT) "" (eq .PUSH "true")}}'
      FULL_TAG: '{{.TAG_PREFIX}}{{.IMAGE_NAME}}:{{.IMAGE_TAG}}'
    preconditions:
      - sh: '{{if and (ne .PUSH "true") (contains "," .PLATFORMS)}}exit 1{{end}}'
        msg: "PUSH=false requires single platform (--load limitation)"
      - sh: '[ "{{.CONTAINER_ENGINE}}" != "unknown" ]'
        msg: "No container engine found. Install Docker or Podman."
    cmds:
      - task: _build-binaries
        vars:
          SERVICE: lprobe
      - task: '{{if eq .CONTAINER_ENGINE "docker"}}_build:docker{{else}}_build:podman{{end}}'
        vars:
          IMAGE_NAME: '{{.IMAGE_NAME}}'
          DOCKERFILE: '{{.DOCKERFILE}}'
          BUILD_ARGS: '{{.BUILD_ARGS}}'
          FULL_TAG: '{{.FULL_TAG}}'
          OUTPUT: '{{.OUTPUT}}'

  _build:docker:
    internal: true
    deps: [buildx:setup]
    requires:
      vars: [IMAGE_NAME, DOCKERFILE, FULL_TAG]
    cmd: >-
      docker buildx build
      --builder {{.IMAGE_BUILDER}}
      --platform {{.PLATFORMS}}
      --build-arg ALPINE_VERSION={{.ALPINE_VERSION}}
      {{.BUILD_ARGS}}
      -t {{.FULL_TAG}}
      -f dockerfile/{{.DOCKERFILE}}
      {{.OUTPUT}}
      .

  _build:podman:
    internal: true
    requires:
      vars: [IMAGE_NAME, DOCKERFILE, FULL_TAG]
    cmds:
      - >-
        {{if contains "," .PLATFORMS}}
        podman build
        --platform {{.PLATFORMS}}
        --manifest {{.FULL_TAG}}
        --build-arg ALPINE_VERSION={{.ALPINE_VERSION}}
        {{.BUILD_ARGS}}
        -f dockerfile/{{.DOCKERFILE}}
        .
        {{else}}
        podman build
        --platform {{.PLATFORMS}}
        --build-arg ALPINE_VERSION={{.ALPINE_VERSION}}
        {{.BUILD_ARGS}}
        -t {{.FULL_TAG}}
        -f dockerfile/{{.DOCKERFILE}}
        .
        {{end}}
      - >-
        {{if and (eq .PUSH "true") (contains "," .PLATFORMS)}}
        podman manifest push --all {{.FULL_TAG}} docker://{{.FULL_TAG}}
        {{else if eq .PUSH "true"}}
        podman push {{.FULL_TAG}}
        {{end}}

  verify-release-images:
    desc: "Verify every pushed release image contains amd64 and arm64 manifests"
    preconditions:
      - sh: command -v skopeo >/dev/null 2>&1
        msg: "skopeo is required to verify pushed image manifests"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required to verify pushed image manifests"
    cmds:
      - |
        images="harbor-core harbor-jobservice harbor-registryctl harbor-exporter harbor-portal harbor-registry trivy-adapter"
        if [ -f dockerfile/grype-scanner.dockerfile ]; then
          images="${images} harbor-grype-adapter"
        fi
        if [ -f dockerfile/snyk-scanner.dockerfile ]; then
          images="${images} harbor-snyk-adapter"
        fi

        for image in ${images}; do
          reference="{{.REGISTRY_ADDRESS}}/{{.REGISTRY_PROJECT}}/${image}:{{.IMAGE_TAG}}"
          platforms=$(skopeo inspect --raw "docker://${reference}" \
            | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"')
          printf '%s\n' "${platforms}" | grep -Fqx 'linux/amd64' || {
            echo "Missing linux/amd64 manifest: ${reference}" >&2
            exit 1
          }
          printf '%s\n' "${platforms}" | grep -Fqx 'linux/arm64' || {
            echo "Missing linux/arm64 manifest: ${reference}" >&2
            exit 1
          }
          echo "Verified ${reference}"
        done

  _build-binaries:
    internal: true
    requires:
      vars: [SERVICE]
    cmds:
      - for: { var: PLATFORMS, split: ',' }
        task: 'build:binary:{{.SERVICE}}:{{.ITEM | trim | replace "/" "-"}}'

  _binary-image:
    internal: true
    requires:
      vars: [SERVICE]
    cmds:
      - task: _build-binaries
        vars:
          SERVICE: '{{.SERVICE}}'
      - task: _build
        vars:
          IMAGE_NAME: 'harbor-{{.SERVICE}}'
          DOCKERFILE: '{{.SERVICE}}.dockerfile'
          BUILD_ARGS: '{{.BUILD_ARGS | default ""}}'

  # --- Go Services (require pre-built binaries) ---

  core:
    desc: "Build Core image (compiles binary, then builds container)"
    cmds:
      - task: _binary-image
        vars:
          SERVICE: core

  jobservice:
    desc: "Build JobService image (compiles binary, then builds container)"
    cmds:
      - task: _binary-image
        vars:
          SERVICE: jobservice

  registryctl:
    desc: "Build RegistryCtl image (compiles binary, then builds container)"
    cmds:
      - task: _binary-image
        vars:
          SERVICE: registryctl

  exporter:
    desc: "Build Exporter image (compiles binary, then builds container)"
    cmds:
      - task: _binary-image
        vars:
          SERVICE: exporter
          BUILD_ARGS: '--build-arg harbor_version={{.VERSION}} --build-arg git_commit={{.GIT_COMMIT}}'

  # --- Standalone Images ---

  portal:
    desc: "Build Portal image (Angular frontend on Nginx)"
    cmds:
      - task: _build
        vars:
          IMAGE_NAME: harbor-portal
          DOCKERFILE: portal.dockerfile
          BUILD_ARGS: '--build-arg BUN_VERSION={{.BUN_VERSION}} --build-arg NGINX_VERSION={{.NGINX_VERSION}}'

  registry:
    desc: "Build Distribution Registry image (compiles binary, then builds container)"
    cmds:
      - task: _binary-image
        vars:
          SERVICE: registry

  trivy-adapter:
    desc: "Build Trivy scanner adapter image (compiles binary, then builds container)"
    cmds:
      - task: _build-binaries
        vars:
          SERVICE: trivy-adapter
      - task: _build-binaries
        vars:
          SERVICE: trivy
      - task: _build
        vars:
          IMAGE_NAME: trivy-adapter
          DOCKERFILE: trivy-adapter.dockerfile
          BUILD_ARGS: '--build-arg HARBOR_SCANNER_TRIVY_VERSION={{.HARBOR_SCANNER_TRIVY_VERSION}} --build-arg TRIVY_BASE_IMAGE_VERSION={{.TRIVY_BASE_IMAGE_VERSION}}'

  # --- Utilities ---

  clean:
    desc: "Remove all local harbor-* images"
    cmd: docker images --format '{{`{{.ID}}`}}' --filter 'reference=*harbor*' | xargs -r docker rmi -f
    ignore_error: true

  prune:
    desc: "Prune buildx build cache"
    cmd: docker builder prune -f

  list:
    desc: "List local harbor-* images"
    cmd: docker images --filter 'reference=*harbor*'

  inspect:*:
    desc: "Inspect multi-arch manifest in remote registry"
    cmd: docker buildx imagetools inspect {{.REGISTRY_ADDRESS}}/{{.REGISTRY_PROJECT}}/{{index .MATCH 0}}:{{.VERSION}}
