version: '3'

vars:
  PATCHES_REPO: '{{.PATCHES_REPO | default "github.com/container-registry/8gcr"}}'
  PATCHES_CLONE_URL: '{{.PATCHES_CLONE_URL | default "git@github.com:container-registry/8gcr.git"}}'
  PATCHES_SERIES: '{{.PATCHES_SERIES | default (printf "%s/taskfile/commercial-patches" .ROOT_DIR)}}'
  PATCHES_STACKS: '{{.PATCHES_STACKS | default (printf "%s/taskfile/commercial-patch-stacks" .ROOT_DIR)}}'
  PATCH_AUTH_DIR: '{{.PATCH_AUTH_DIR | default ".opencode/tmp/patch-auth"}}'
  RELEASE_READY_DIR: '{{.RELEASE_READY_DIR | default ".opencode/tmp/release-ready"}}'
  PATCHES_REMOTE_URL:
    sh: |
      if [ -n "${PATCHES_TOKEN:-}" ]; then
        printf '%s' 'https://x-access-token@{{.PATCHES_REPO}}'
      else
        printf '%s' '{{.PATCHES_CLONE_URL}}'
      fi
  PATCH_BRANCHES:
    sh: |
      awk '
        { sub(/#.*/, ""); gsub(/^[[:space:]]+|[[:space:]]+$/, "") }
        NF && seen[$0]++ { print "Duplicate commercial patch branch: " $0 > "/dev/stderr"; exit 1 }
        NF { print }
      ' '{{.PATCHES_SERIES}}'

tasks:
  apply-patches:
    desc: "Apply Harbor's declared commercial patches via jj"
    preconditions:
      - sh: command -v git >/dev/null 2>&1
        msg: "git is required"
      - sh: command -v jj >/dev/null 2>&1
        msg: "jj (Jujutsu) is required"
      - sh: test -f '{{.PATCHES_SERIES}}'
        msg: "commercial patch manifest not found: {{.PATCHES_SERIES}}"
      - sh: test -z "$(if [ -d .jj ]; then jj diff --summary; else git status --porcelain; fi)"
        msg: "applying release patches requires a clean worktree"
    cmds:
      - task: _validate-series
      - task: _clean-auth
      - defer: { task: _clean-auth }
      - task: _configure-auth
      - task: _fetch-patches
      - task: _validate-patches
      - task: _import-patches
      - task: _duplicate-patches
      - task: _verify-patches

  check:
    desc: "Verify the declared commercial patches apply to a clean clone"
    vars:
      REPO_ROOT:
        sh: pwd -P
      GIT_REPO_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
      CHECKOUT_REF:
        sh: jj log -r @ --no-graph -T commit_id 2>/dev/null || git rev-parse HEAD
      CHECKOUT_DIR: '{{.REPO_ROOT}}/{{.RELEASE_READY_DIR}}/worktree'
      CHECKOUT_AUTH_DIR: '{{.REPO_ROOT}}/{{.RELEASE_READY_DIR}}/auth'
    cmds:
      - task: _clean-checkout
      - defer: { task: _clean-checkout }
      - task: _clone-checkout
        vars:
          GIT_REPO_DIR: '{{.GIT_REPO_DIR}}'
          CHECKOUT_DIR: '{{.CHECKOUT_DIR}}'
          CHECKOUT_REF: '{{.CHECKOUT_REF}}'
      - >-
        task --dir '{{.CHECKOUT_DIR}}' apply-patches
        PATCH_AUTH_DIR='{{.CHECKOUT_AUTH_DIR}}'
        PATCHES_SERIES='{{.PATCHES_SERIES}}'
      - echo "Release-ready patch validation succeeded."

  _validate-series:
    internal: true
    requires:
      vars: [PATCH_BRANCHES]
    env:
      DECLARED_PATCH_BRANCHES: '{{.PATCH_BRANCHES}}'
    cmds:
      - |
        while IFS= read -r branch; do
          git check-ref-format --branch "${branch}" >/dev/null
        done <<< "${DECLARED_PATCH_BRANCHES}"

  _clean-auth:
    internal: true
    cmd: rm -rf '{{.PATCH_AUTH_DIR}}'

  _configure-auth:
    internal: true
    cmds:
      - mkdir -p '{{.PATCH_AUTH_DIR}}'
      - >-
        printf '%s\n'
        '#!/usr/bin/env bash'
        'case "$1" in'
        "  *Username*) printf '%s\\n' 'x-access-token' ;;"
        "  *Password*) printf '%s\\n' \"\${PATCHES_TOKEN}\" ;;"
        '  *) exit 1 ;;'
        'esac'
        > '{{.PATCH_AUTH_DIR}}/git-askpass'
      - chmod 700 '{{.PATCH_AUTH_DIR}}/git-askpass'

  _fetch-patches:
    internal: true
    env:
      GIT_ASKPASS: '{{.PATCH_AUTH_DIR}}/git-askpass'
      GIT_TERMINAL_PROMPT: '0'
      PATCHES_FETCH_URL: '{{.PATCHES_REMOTE_URL}}'
      DECLARED_PATCH_BRANCHES: '{{.PATCH_BRANCHES}}'
    cmds:
      - |
        refspecs=()
        while IFS= read -r branch; do
          refspecs+=("+refs/heads/${branch}:refs/remotes/patches/${branch}")
        done <<< "${DECLARED_PATCH_BRANCHES}"
        git fetch --no-tags "${PATCHES_FETCH_URL}" "${refspecs[@]}"

  _validate-patches:
    internal: true
    env:
      DECLARED_PATCH_BRANCHES: '{{.PATCH_BRANCHES}}'
      PATCHES_STACKS_FILE: '{{.PATCHES_STACKS}}'
    cmds:
      # Branch = linear chain of non-merge commits. Its root must parent on
      # the target, or on its declared parent's chain (commercial-patch-stacks).
      - |
        base=$(git rev-parse HEAD)
        stacks=""
        if [ -f "${PATCHES_STACKS_FILE}" ]; then
          stacks=$(awk '
            { sub(/#.*/, "") }
            NF == 2 { print $1 " " $2 }
            NF == 1 || NF > 2 { print "malformed stacks line: " $0 > "/dev/stderr"; exit 1 }
          ' "${PATCHES_STACKS_FILE}")
        fi

        while IFS= read -r branch; do
          tip=$(git rev-parse "refs/remotes/patches/${branch}^{commit}")
          stack_parent=$(printf '%s\n' "${stacks}" | awk -v b="${branch}" '$1 == b { print $2 }')
          expected=""
          if [ -n "${stack_parent}" ]; then
            printf '%s\n' "${DECLARED_PATCH_BRANCHES}" | grep -qx "${stack_parent}" || {
              echo "stack parent of ${branch} is not a declared branch: ${stack_parent}" >&2
              exit 1
            }
            expected=$(git rev-parse "refs/remotes/patches/${stack_parent}^{commit}")
          fi

          c="${tip}"
          depth=0
          while :; do
            parents=$(git show -s --format='%P' "${c}")
            if [ "$(wc -w <<< "${parents}")" -ne 1 ]; then
              echo "commercial patch chain contains a merge commit: ${branch} at ${c}" >&2
              exit 1
            fi
            # a stacked root may sit anywhere on its declared parent's
            # chain (the parent's tip moves on every landed PR)
            if [ -n "${expected}" ] \
                && git merge-base --is-ancestor "${parents}" "${expected}" \
                && ! git merge-base --is-ancestor "${parents}" "${base}"; then
              break
            fi
            if git merge-base --is-ancestor "${parents}" "${base}"; then
              if [ -n "${expected}" ]; then
                echo "declared stacked branch is rooted on the target instead of ${stack_parent}: ${branch}" >&2
                exit 1
              fi
              break
            fi
            depth=$((depth + 1))
            if [ "${depth}" -gt 200 ]; then
              echo "commercial patch chain did not reach the target or its declared stack parent: ${branch}" >&2
              exit 1
            fi
            c="${parents}"
          done
        done <<< "${DECLARED_PATCH_BRANCHES}"

  _import-patches:
    internal: true
    cmds:
      - task: _init-jj
      - jj git import >/dev/null

  _init-jj:
    internal: true
    status:
      - test -d .jj
    cmd: jj git init --colocate >/dev/null

  _duplicate-patches:
    internal: true
    env:
      DECLARED_PATCH_BRANCHES: '{{.PATCH_BRANCHES}}'
    status:
      - |
        patch_revset=$(printf '%s\n' "${DECLARED_PATCH_BRANCHES}" | while IFS= read -r branch; do
          git rev-parse "refs/remotes/patches/${branch}^{commit}"
        done | paste -sd '|' -)
        patchset_id=$(printf '%s' "${patch_revset}" | git hash-object --stdin)
        test "$(jj log -r @ --no-graph -T 'description.first_line()')" = "release patches ${patchset_id}"
    cmds:
      # Duplicate each branch's full chain as one set: `~ ::@` drops what
      # the target already has; stacked roots keep their in-set parents.
      - |
        patch_revset=$(printf '%s\n' "${DECLARED_PATCH_BRANCHES}" | while IFS= read -r branch; do
          git rev-parse "refs/remotes/patches/${branch}^{commit}"
        done | paste -sd '|' -)
        patchset_id=$(printf '%s' "${patch_revset}" | git hash-object --stdin)
        chain_revset=$(printf '%s' "${patch_revset}" | sed 's/^/::/; s/|/ | ::/g')
        base=$(jj log -r @ --no-graph -T commit_id)
        jj duplicate "(${chain_revset}) ~ ::${base}" --onto @
        jj new "heads(${base}::) ~ ${base}" -m "release patches ${patchset_id}"

  _verify-patches:
    internal: true
    env:
      DECLARED_PATCH_BRANCHES: '{{.PATCH_BRANCHES}}'
    preconditions:
      - sh: test -z "$(jj log -r '::@ & conflicts()' --no-graph -T commit_id)"
        msg: "commercial patches did not apply cleanly; run 'jj resolve --list'"
    cmds:
      - echo "Applied commercial patches from {{.PATCHES_SERIES}}:"
      - |
        while IFS= read -r branch; do
          echo "  ${branch}"
        done <<< "${DECLARED_PATCH_BRANCHES}"

  _clean-checkout:
    internal: true
    cmd: rm -rf '{{.RELEASE_READY_DIR}}'

  _clone-checkout:
    internal: true
    cmds:
      - mkdir -p '{{.RELEASE_READY_DIR}}'
      - git clone --local '{{.GIT_REPO_DIR}}' '{{.CHECKOUT_DIR}}'
      - git -C '{{.CHECKOUT_DIR}}' checkout -B release-ready-check '{{.CHECKOUT_REF}}'
