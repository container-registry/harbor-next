name: Setup jj
description: Install the jj (Jujutsu) CLI, which the commercial patch octopus needs.

inputs:
  version:
    description: jj release to install
    required: false
    default: "0.44.0"

runs:
  using: composite
  steps:
    - name: Install jj
      shell: bash
      env:
        JJ_VERSION: ${{ inputs.version }}
      run: |
        if command -v jj >/dev/null 2>&1; then
          jj --version
          exit 0
        fi

        case "$(uname -m)" in
          x86_64|amd64) arch="x86_64" ;;
          aarch64|arm64) arch="aarch64" ;;
          *)
            echo "::error::Unsupported architecture: $(uname -m)"
            exit 1
            ;;
        esac

        curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-${arch}-unknown-linux-musl.tar.gz" -o /tmp/jj.tar.gz
        mkdir -p /tmp/jj-extract
        tar -xzf /tmp/jj.tar.gz -C /tmp/jj-extract
        sudo install -m 755 /tmp/jj-extract/jj /usr/local/bin/jj
        rm -rf /tmp/jj.tar.gz /tmp/jj-extract

        jj --version
