name: Sync Patch Branches

# harbor-next/main moved -> rebase every patch branch (+ dev) onto new
# tip, force-push. No PRs. Conflict = red run, resolve locally with
# task jj:setup-dev, then push via task jj:sync-patch-branches.
# Repo actions policy = github-owned only -> task/jj installed via curl.
on:
  repository_dispatch:
    types: [upstream-sync]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-verify
  cancel-in-progress: false

jobs:
  sync-patch-branches:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      # ref dev = current jj taskfile. full history = jj merge needs it.
      - name: Checkout dev
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Task
        env:
          TASK_VERSION: "3.49.1"
        run: |
          if command -v task >/dev/null 2>&1; then
            task --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64|amd64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          curl -fsSL "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_${arch}.tar.gz" -o /tmp/task.tar.gz
          mkdir -p /tmp/task-extract
          tar -xzf /tmp/task.tar.gz -C /tmp/task-extract
          sudo install -m 755 /tmp/task-extract/task /usr/local/bin/task
          rm -rf /tmp/task.tar.gz /tmp/task-extract
          task --version

      - name: Install jj
        env:
          JJ_VERSION: "0.44.0"
        run: |
          if command -v jj >/dev/null 2>&1; then
            jj --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-${arch}-unknown-linux-musl.tar.gz" -o /tmp/jj.tar.gz
          mkdir -p /tmp/jj-extract
          tar -xzf /tmp/jj.tar.gz -C /tmp/jj-extract
          sudo install -m 755 /tmp/jj-extract/jj /usr/local/bin/jj
          rm -rf /tmp/jj.tar.gz /tmp/jj-extract
          jj --version

      - name: Initialize jj (colocated)
        run: |
          if [ ! -d .jj ]; then
            jj git init --colocate
          fi
          # jj refuses to push commits with empty identity
          jj config set --user user.name '"github-actions[bot]"' 
          jj config set --user user.email '"41898282+github-actions[bot]@users.noreply.github.com"' 

      # setup-dev = bootstrap (remotes/fetch/track) + megamerge build.
      # sync-patch-branches = rebase all onto next/main tip, force-push.
      # Refuses push while conflicted -> red run.
      - name: Rebase patch branches onto next/main and push
        run: |
          task jj:setup-dev
          task jj:sync-patch-branches
