name: Main Images

on:
  workflow_run:
    workflows: [Release Ready]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read Version
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read VERSION
        id: version
        run: |
          version=$(tr -d '\n' < VERSION)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish Latest Images
    needs: [version]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-images.yml
    with:
      checkout_ref: ${{ github.event.workflow_run.head_sha }}
      image_tag: latest
      version: ${{ needs.version.outputs.version }}
      artifact_prefix: main-latest
      registry_address: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      registry_project: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
    secrets: inherit
