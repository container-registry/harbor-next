name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  push:
    branches:
      - main

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    # Scheduled runs are reserved for the canonical repository; forks retain push checks.
    if: github.event_name != 'schedule' || github.repository == 'container-registry/harbor-next'
    # Scorecard result publishing requires a single GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-26.04
    permissions:
      # uploads the SARIF to the code-scanning dashboard
      security-events: write
      # publishes the result and mints the badge
      id-token: write
      contents: read
      # the checks read workflow runs, commits, PRs and check results
      actions: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
