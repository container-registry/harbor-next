name: Publish Helm Chart

run-name: Publish Helm Chart ${{ inputs.tag_name }}

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing chart release tag to publish
        required: true
        type: string
    secrets:
      REGISTRY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing chart release tag, for example chart-v2.0.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-chart-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm Chart
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      REGISTRY_PROJECT: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
      TAG_NAME: ${{ inputs.tag_name }}
    steps:
      - name: Resolve release tag
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tagName = process.env.TAG_NAME;
            const match = /^chart-v([0-9]+\.[0-9]+\.[0-9]+)$/.exec(tagName);
            if (!match) {
              core.setFailed('TAG_NAME must match chart-vX.Y.Z');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: tag } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`,
            });
            if (tag.object.type !== 'commit') {
              core.setFailed(`${tagName} must be a lightweight tag`);
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: tagName,
            });
            // release-please records target_commitish as release commit SHA.
            // Comparing both refs rejects a tag moved after release creation;
            // checking out SHA below prevents a later move changing inputs.
            if (release.draft || release.target_commitish !== tag.object.sha) {
              core.setFailed(`${tagName} must be a published release pinned to ${tag.object.sha}`);
              return;
            }

            core.exportVariable('VERSION', match[1]);
            core.setOutput('sha', tag.object.sha);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Load versions
        # Helm homes: self-hosted runner images may ship a root-owned
        # ~/.cache; keep all helm state in the always-writable temp.
        run: |
          grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"
          {
            echo "HELM_CACHE_HOME=${RUNNER_TEMP}/helm/cache"
            echo "HELM_CONFIG_HOME=${RUNNER_TEMP}/helm/config"
            echo "HELM_DATA_HOME=${RUNNER_TEMP}/helm/data"
          } >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install envsubst
        run: command -v envsubst || (sudo apt-get update && sudo apt-get install -y gettext-base)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_ADDRESS }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Add per-release Artifact Hub images annotation
        # Shared with the chart-ci dry run so the release-only packaging
        # path is exercised on every chart PR, not first on release day.
        run: |
          .github/scripts/chart-annotate-images.sh \
            deploy/chart "${REGISTRY_ADDRESS}" "${REGISTRY_PROJECT}"

      - name: Install Artifact Hub CLI
        # Binary, not `docker run -v`: the self-hosted runners talk to a
        # remote DinD daemon, so a bind mount resolves on the DinD host and
        # silently sees nothing from the runner workspace. Checksum-verified
        # before it runs, because this job holds registry credentials and
        # id-token: write.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) goarch="amd64" ;;
            aarch64|arm64) goarch="arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="ah_${AH_VERSION}_linux_${goarch}.tar.gz"
          tool_dir="${RUNNER_TEMP}/ah"
          base="https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}"
          mkdir -p "${tool_dir}/bin"
          curl -fsSL "${base}/${archive}" -o "${tool_dir}/${archive}"
          curl -fsSL "${base}/ah_${AH_VERSION}_checksums.txt" -o "${tool_dir}/ah_checksums.txt"
          (cd "${tool_dir}" && grep "  ${archive}$" ah_checksums.txt | sha256sum -c -)
          tar -xzf "${tool_dir}/${archive}" -C "${tool_dir}/bin" ah
          echo "${tool_dir}/bin" >> "$GITHUB_PATH"

      - name: Validate Artifact Hub metadata
        run: ah lint --kind helm --path deploy/chart

      - name: Build chart dependencies
        # deploy/chart/charts/ is gitignored, so a fresh checkout has no
        # subcharts and `helm package` would fail with "found in Chart.yaml,
        # but missing in charts/ directory". Chart.lock is committed, so
        # `dependency build` resolves the pinned versions, not the latest.
        run: helm dependency build deploy/chart

      - name: Package chart
        # VERSION comes from the validated release tag. appVersion is not
        # overridden: it stays as committed in Chart.yaml so default image
        # tags resolve to an already-published Harbor app version.
        run: |
          helm package deploy/chart \
            --version "${VERSION}" \
            --destination dist

      - name: Push chart
        id: push
        # pipefail: GitHub's default shell is `bash -e` without it, so a
        # failing helm push would be masked by tee — and its error message
        # contains a sha256 digest the capture below would happily match.
        run: |
          set -euo pipefail
          helm push "dist/harbor-next-${VERSION}.tgz" \
            "oci://${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/charts" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
          if [ -z "$digest" ]; then
            echo "Failed to capture chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/charts/harbor-next@${CHART_DIGEST}"

      - name: Install oras
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Push Artifact Hub repository metadata
        # artifacthub-repo.yml rides next to the chart as an OCI artifact
        # (artifacthub.io tag) — Artifact Hub reads it for ownership /
        # verified publisher. See deploy/chart/artifacthub-repo.yml.
        working-directory: deploy/chart
        run: |
          oras push "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/charts/harbor-next:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
