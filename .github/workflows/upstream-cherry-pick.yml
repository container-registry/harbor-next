name: Upstream Cherry-Pick

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log planned PRs without pushing branches or creating PRs
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3,15 * * *"

permissions: {}

concurrency:
  group: upstream-cherry-pick
  cancel-in-progress: false

jobs:
  upstream-cherry-pick:
    name: Open upstream cherry-pick PRs
    # Forks may use the manual dry-run, but must not run the canonical schedule.
    if: github.event_name != 'schedule' || github.repository == 'container-registry/harbor-next'
    runs-on: ubuntu-26.04
    permissions:
      # pushes the cherry-pick branches
      contents: write
      # opens the PRs and labels them
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Open PRs
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upstream-cherry-pick.mjs`);
            await run({ github, context, core, exec });
