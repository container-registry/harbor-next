name: Nightly

# A nightly is the real release, cut against a throwaway branch.
#
# Every step below is the release pipeline's own: the same release-please
# configuration (derived from release-please-config.json, never a copy), the
# same publish-images.yml, the same release-notes-engine.yml. The only thing
# this workflow adds is the channel branch and the scheduled merge of the
# release PR that the channel produces.
#
# main's release-please state is untouched: the channel carries its own
# config and manifest, on its own branch, and is rebuilt from main's head
# every night. Because the channel manifest is re-seeded from the real
# manifest each time, every nightly accumulates from the last published
# release — the notes are tonight's snapshot of the upcoming release, not a
# nightly changelog stream of their own.

on:
  schedule:
    # The release PR is opened and merged in the same run, so there is never a
    # half-open nightly release PR waiting around.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two nightlies at once: they share the channel branch.
  group: nightly
  cancel-in-progress: false

jobs:
  channel:
    name: Open Nightly Channel
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Force-pushes the nightly channel branch.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      beta_tag: ${{ steps.version.outputs.beta_tag }}
    env:
      # Read by the askpass script below when the channel branch is pushed.
      GH_TOKEN: ${{ secrets.NIGHTLY_CHANNEL_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: release-please walks back to the last release tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-task

      - name: Validate the nightly inputs
        # Keeps the official tag and image names on the release line. Checkout
        # comes first because the guard lives in the repository; it still runs
        # before anything is fetched, built or published.
        run: task nightly:validate-inputs

      - name: Configure ephemeral Git authentication
        run: |
          askpass="${RUNNER_TEMP}/git-askpass"
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${GH_TOKEN}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"
          echo "GIT_ASKPASS=${askpass}" >> "${GITHUB_ENV}"
          echo "GIT_TERMINAL_PROMPT=0" >> "${GITHUB_ENV}"

      - name: Resolve nightly version
        id: version
        run: |
          # -o interleaved: the root Taskfile prefixes output per task, which
          # would end up inside the captured value.
          version=$(task -o interleaved nightly:version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          beta_tag=$(task -o interleaved nightly:beta-tag)
          echo "beta_tag=${beta_tag}" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview ${version}, published as ${beta_tag}"

      - name: Open the nightly channel
        run: task nightly:channel PUSH_CHANNEL=true

  release:
    name: Release Nightly
    needs: [channel]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-task

      # Opens the release PR against the channel branch. Nothing to release
      # yet, so the release half is skipped.
      - name: Open the nightly release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Same fallback as the channel push and the merge: a ruleset over the
          # channel branch would otherwise merge the PR and then fail to tag it.
          token: ${{ secrets.NIGHTLY_CHANNEL_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: nightly
          config-file: release-please-config-nightly.json
          manifest-file: .release-please-manifest-nightly.json
          skip-github-release: true

      - name: Merge the nightly release PR
        id: merge
        env:
          # The nightly release PR is merged by this workflow, by design.
          # NIGHTLY_CHANNEL_TOKEN only has to exist if the channel branch ever
          # ends up under a ruleset that GITHUB_TOKEN cannot satisfy.
          GH_TOKEN: ${{ secrets.NIGHTLY_CHANNEL_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          sha=$(task -o interleaved nightly:merge-release-pr)
          echo "merge_sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ -z "${sha}" ]; then
            echo "::notice::Nothing landed since the last release; nothing to publish tonight"
          fi

      # release-please only ever opens the PR now. The tag and the single
      # rolling pre-release are this workflow's, because release-please cannot
      # hold one name still across nights.
      - name: Move the tags onto tonight's release commit
        if: ${{ steps.merge.outputs.merge_sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_CHANNEL_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: task nightly:publish-tags MERGE_SHA="${MERGE_SHA}"

      - name: Upsert the rolling pre-release
        if: ${{ steps.merge.outputs.merge_sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_CHANNEL_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: task nightly:upsert-beta-release

  publish-images:
    name: Publish Nightly Images
    needs: [channel, release]
    if: ${{ needs.release.outputs.merge_sha != '' }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/publish-images.yml
    with:
      # The commit, not a tag: the only tag this run makes is the moving one.
      checkout_ref: ${{ needs.release.outputs.merge_sha }}
      image_tag: ${{ needs.channel.outputs.beta_tag }}
      version: ${{ needs.channel.outputs.version }}
      # Unique per run: the tag no longer is.
      artifact_prefix: nightly-${{ github.run_id }}
      registry_address: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      registry_project: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
    secrets:
      # Only what the reusable workflow declares; inherit would hand it every
      # secret this workflow can see.
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

  release-notes:
    name: Update Nightly Release Notes
    needs: [channel, release, publish-images]
    if: ${{ needs.release.outputs.merge_sha != '' }}
    permissions:
      contents: write
    uses: $/.github/workflows/release-notes-engine.yml
    with:
      tag_name: ${{ needs.channel.outputs.beta_tag }}
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

  # Deliberately absent, and they must stay absent:
  #
  # - mark-commercial-release: stamping the 8gcr changelog markers would move
  #   the commercial entries out of the unreleased block, and the real
  #   release's notes would lose them.
  # - the chart jobs and the appVersion bump: the chart tracks published
  #   releases, and a nightly is not one.

  verify:
    name: Verify Nightly Images
    needs: [channel, release, publish-images]
    if: ${{ needs.release.outputs.merge_sha != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      core_digest: ${{ steps.digest.outputs.ref }}
    env:
      IMAGE_TAG: ${{ needs.channel.outputs.beta_tag }}
      REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      REGISTRY_PROJECT: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-task

      - name: Install skopeo
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install -y skopeo)

      - name: Log in to registry
        # skopeo reads the Docker config this writes. The project answers an
        # anonymous pull today, but the verification of a release must not
        # depend on that staying true.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_ADDRESS }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Verify both architectures landed
        run: |
          task image:verify-release-images \
            IMAGE_TAG="${IMAGE_TAG}" \
            REGISTRY_ADDRESS="${REGISTRY_ADDRESS}" \
            REGISTRY_PROJECT="${REGISTRY_PROJECT}"

      - name: Resolve the digest behind the moving tag
        id: digest
        # The only immutable handle on tonight's build now that no dated tag
        # is published. It goes in the pre-release body so a reader can pin.
        run: |
          image="${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/harbor-core"
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${image}:${IMAGE_TAG}")
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::${IMAGE_TAG} is ${digest}"

  e2e:
    name: E2E
    # After verify: the suite pulls these images, so there is no point
    # running before both architectures are known to be there.
    needs: [channel, release, verify]
    if: ${{ needs.release.outputs.merge_sha != '' }}
    permissions:
      contents: read
    uses: $/.github/workflows/nightly-e2e.yml
    with:
      tag: ${{ needs.channel.outputs.beta_tag }}
      channel: nightly
      # Where these images actually went, resolved the same way the publish
      # job resolves it.
      registry_address: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      registry_project: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  annotate:
    name: Annotate the Rolling Pre-Release
    # release-notes as well as e2e: the notes engine replaces the whole body,
    # so a header written before it finishes is silently gone.
    needs: [channel, release, release-notes, verify, e2e]
    # Both must have succeeded. A failed release job may not have moved the
    # tags, and a failed notes job leaves last night's body in place — either
    # way the header would describe a build the rest of the release does not.
    # verify too: an `if` here drops the implicit success requirement on every
    # need, and without the digest the header has no immutable reference to give.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release-notes.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-task

      - name: Write the header block
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ needs.release.outputs.merge_sha }}
          DIGEST_REF: ${{ needs.verify.outputs.core_digest }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_PASSED: ${{ needs.e2e.outputs.scenarios_passed }}
          E2E_TOTAL: ${{ needs.e2e.outputs.scenarios_total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
          REGISTRY_PROJECT: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
        run: |
          task nightly:beta-header \
            MERGE_SHA="${MERGE_SHA}" \
            DIGEST_REF="${DIGEST_REF}" \
            E2E_RESULT="${E2E_RESULT}" \
            E2E_PASSED="${E2E_PASSED}" \
            E2E_TOTAL="${E2E_TOTAL}" \
            RUN_URL="${RUN_URL}"
