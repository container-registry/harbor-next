extends: [[spectral:oas, all]]

functionsDir: "./tools/spectral/functions"

functions: [requireRequestId]

rules:
  no-$ref-siblings: false
  oas2-valid-schema-example: false
  oas2-api-host: false

  required-operationId:
    description: must have a operationId.
    given: $.paths[*][*]
    severity: error
    then:
      field: operationId
      function: truthy

  camel-case-operationId:
    description: should be camelCased.
    type: style
    given: $.paths[*][*].operationId
    then:
      function: casing
      functionOptions:
        type: camel

  requestId-required:
    description: must have a requestId parameters.
    given: $.paths[*][*]
    severity: error
    then:
      field: parameters
      function: requireRequestId

  operation-description:
    description: Every operation must have a description field.
    given: $.paths[*][*]
    severity: error
    then:
      field: description
      function: truthy

  operation-summary-required:
    description: Every operation must have a summary field.
    given: $.paths[*][*]
    severity: error
    then:
      field: summary
      function: truthy

  no-host:
    description: must not declare host; clients use relative paths.
    given: $
    severity: error
    then:
      field: host
      function: undefined

  https-only-schemes:
    description: schemes must not advertise plaintext http.
    given: $.schemes[*]
    severity: error
    then:
      function: enumeration
      functionOptions:
        values: [https]
