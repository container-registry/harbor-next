# TLS termination — mount cert/key and this file into portal container
listen 8443 ssl;
ssl_certificate /etc/nginx/ssl/tls.crt;
ssl_certificate_key /etc/nginx/ssl/tls.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Redirect HTTP → HTTPS when TLS is active. $host carries no port and
# $http_host carries the HTTP one, so the HTTPS port has to be set here.
# nginx cannot read PORT_HTTPS from the environment: when it is not 443,
# copy this file, set the same port below and point TLS_CONF at the copy.
set $https_port 443;

set $https_authority $host:$https_port;
if ($https_port = 443) {
    set $https_authority $host;
}
if ($scheme = "http") {
    return 301 https://$https_authority$request_uri;
}
