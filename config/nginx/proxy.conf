# Reverse-proxy to Harbor Core API
# Mount into /etc/nginx/proxy.d/ to activate

client_max_body_size 0;
proxy_buffering off;
proxy_request_buffering off;

# $http_host keeps the port; $host drops it. Harbor builds the registry token
# realm and its redirects from this header, so on any non-default port $host
# hands clients a realm on port 80 and every docker login fails.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location /v2/ {
    proxy_pass http://core:8080;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
}

location /api/ {
    proxy_pass http://core:8080;
}

location /service/ {
    proxy_pass http://core:8080;
}

location /c/ {
    proxy_pass http://core:8080;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
}
